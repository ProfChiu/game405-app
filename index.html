  .modal.framed{display:flex;flex-direction:column;padding:20px 0 0}

  .td-cover.has-img span{color:#fff;opacity:.6;text-shadow:0 2px 8px rgba(0,0,0,.5)}

  .seg button.opt-NotStarted[aria-pressed="true"]{background:#efefef;color:#3c4043}
  .seg button.opt-InProgress[aria-pressed="true"]{background:#fff2cc;color:#7f6000}
  .seg button.opt-Completed[aria-pressed="true"]{background:#d9ead3;color:#274e13}
  .seg button.opt-Approved[aria-pressed="true"]{background:#188038;color:#fff;border-color:#188038;box-shadow:inset 0 0 0 1px #0d5c26}

  .dupe-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;
    border:1px solid var(--amber);background:var(--amber-bg);color:#7c4a03;padding:10px 14px;margin-bottom:14px}
  .dupe-banner .sub{color:#8a5a12;margin-top:2px}

  /* Student avatar. Square, hard-edged, 1px border — a passport photo pinned

     board reads as a spreadsheet and a circle looks imported from another app. */
  .avatar{flex:none;border:1px solid var(--border2);background:var(--gray-bg);overflow:hidden;
    display:flex;align-items:center;justify-content:center;color:var(--text3);font-weight:700;
    letter-spacing:.02em;user-select:none}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  /* Identity block: portrait column, then everything that names the project.
     The links row lives INSIDE .proj-idmain so it can never wrap back under

  .proj-id{display:flex;gap:16px;align-items:flex-start}
  .proj-idmain{flex:1;min-width:0}

  .proj-head .avatar.tuck{margin-top:-34px;box-shadow:0 1px 3px rgba(0,0,0,.25);background:var(--surface)}
  .proj-portrait .portrait-hint{position:absolute;left:0;right:0;bottom:-16px;text-align:center;

</style>

<script>
/* =========================================================
   GAME 405 SPRINT DASHBOARD
   Data lives on the server (api.php); this file holds no state of its own
   beyond view preferences.

   AUTH (v1.0.0) — see the security model comment at the top of api.php.
   There is NO secret in this file and none in localStorage. Sign-in exchanges
   a passphrase for a PHP session cookie that is HttpOnly, so script running on
   this page — including any XSS that gets past esc() — cannot read it.
   Everything below simply reacts to the role the server reports back.
   ========================================================= */

const APP_VERSION = "1.3.3";
const STATUSES = ["Not Started","In Progress","Completed","Approved","Backburner"];
const CATS = ["Design","Art","Tech","Other"];
const TYPES = [["Environment","b-env"],["Character","b-char"],["Game","b-game"],["Team","b-team"]];
const SPRINT_WEEKS = [1,2,2,2,2,1];       // 6 sprints / 10 weeks — short ramp-up and wrap-up
const QUARTER_START = "2026-06-15";        // Monday, demo quarter

const todayISO = new Date().toISOString().slice(0,10);
let uid = () => Math.random().toString(36).slice(2,9);

/* ---------- roster identity helpers (Option A: full-name string keys) ---------- */
function fullName(r){
  if(r==null) return "";
  if(typeof r==="string") return r.trim();
  return ((r.first||"")+" "+(r.last||"")).trim();
}
function rosterNames(){ return state.roster.map(fullName); }
/* Grid dropdowns show first names only — full names ate the width. The option
   VALUE stays the full name, so p.student and every saved project file are
   untouched. Falls back to "Saul G." only when two first names collide. */
function shortName(nm){
  const s=String(nm||"").trim(); if(!s) return "";
  const i=s.indexOf(" "); if(i<0) return s;
  const first=s.slice(0,i), rest=s.slice(i+1).trim();
  const clash=state.roster.some(r=>{
    const f=fullName(r); return f!==s && f.slice(0,f.indexOf(" ")>=0?f.indexOf(" "):f.length)===first;
  });
  return clash && rest ? first+" "+rest[0].toUpperCase()+"." : first;
}
/* <option> list bound to full names but labelled short. */
function rosterOptions(selected){
  return state.roster.map(r=>{const nm=fullName(r);
    return `<option value="${esc(nm)}" ${nm===(selected||"")?"selected":""}>${esc(shortName(nm))}</option>`;}).join("");
}
function migrateRoster(arr){
  return (Array.isArray(arr)?arr:[]).map(r=>{
    // photo lives on the PERSON, not the project: a student who deletes and
    // rebuilds their project keeps their face. {url,name} or null.
    if(r && typeof r==="object") return {id:r.id||uid(), first:r.first||"", last:r.last||"", photo:r.photo||null};
    const s=String(r).trim(); const i=s.indexOf(" ");
    return i<0 ? {id:uid(), first:s, last:"", photo:null}
               : {id:uid(), first:s.slice(0,i), last:s.slice(i+1).trim(), photo:null};
  });
}
/* Roster lookups by display name. p.student stores the full name string, so
   this is the join between a project and the person who owns it. */
function rosterByName(nm){
  const key=String(nm||"").trim();
  return state.roster.find(r=>fullName(r)===key) || null;
}
function photoOf(nm){
  const r=rosterByName(nm);
  return (r && r.photo && r.photo.url) ? r.photo.url : null;
}
function initialsOf(nm){
  const s=String(nm||"").trim(); if(!s) return "?";
  const parts=s.split(/\s+/);
  return ((parts[0]||"")[0]||"").toUpperCase() + ((parts[1]||"")[0]||"").toUpperCase();
}
/* Avatar used in the project title area and the student card. Falls back to
   initials rather than a broken-image icon — most of the class will have no
   photo for the first week or two. */
function avatarHTML(nm,size,cls){
  const url=photoOf(nm);
  const px=size||56;
  return `<div class="avatar ${cls||""}" style="width:${px}px;height:${px}px" title="${esc(nm||"")}">`
       + (url?`<img src="${esc(url)}" alt="${esc(nm||"")}">`
             :`<span style="font-size:${Math.round(px*0.34)}px">${esc(initialsOf(nm))}</span>`)
       + `</div>`;
}
/* The portrait block in a project header. For a manager it is also the place
   you SET the photo — the roster table works, but nobody thinks to go looking
   in Manage for a picture they are staring at on the board. Students get the
   same frame without the click, since save_roster would 403 for them anyway. */
function portraitCell(p){
  const r=rosterByName(p.student);
  const canEdit = state.role==="manager" && !!r;
  const inner = avatarHTML(p.student,72,"tuck"+(canEdit?" editable":""));
  if(!canEdit) return `<div class="proj-portrait">${inner}</div>`;
  return `<div class="proj-portrait" onclick="setRosterPhoto('${r.id}')"
    title="${r.photo?"Click to replace this portrait":"Click to add a portrait"}" style="cursor:pointer">
    ${inner}<div class="portrait-hint">${r.photo?"replace":"add photo"}</div></div>`;
}
function parseNameLine(line){
  const s=line.trim(); if(!s) return null;
  // "Last, First" or "First Last"
  if(s.includes(",")){ const [l,f]=s.split(",");  return {id:uid(), first:(f||"").trim(), last:(l||"").trim()}; }
  const i=s.indexOf(" ");
  return i<0 ? {id:uid(), first:s, last:""} : {id:uid(), first:s.slice(0,i), last:s.slice(i+1).trim()};
}
/* ---------- unified task shape: {id,cat,desc,assignee,status,est,points[],notes,images[]}
   A backlog item IS a task not currently in a sprint — same fields, points
   dormant ([]). Idempotent: re-running on an already-unified task is a no-op
   beyond filling in any missing notes/images. ---------- */
function normalizeTaskShape(t,owner){
  if(t==null) return t;
  const legacy = t.status===undefined; // pre-unification backlog items never had `status`
  if(legacy){
    const desc = (t.desc!==undefined? t.desc : (t.text||""));
    return {
      id: t.id||uid(),
      cat: t.cat||"Other",
      desc,
      assignee: t.assignee||owner,
      status: t.done? "Completed":"Not Started",
      est: (t.pts!==undefined? t.pts : (t.est!==undefined? t.est : 1))||1,
      points: Array.isArray(t.points)? t.points : [],
      notes: t.notes||"",
      images: Array.isArray(t.images)? t.images : []
    };
  }
  t.id = t.id||uid();
  t.cat = t.cat||"Other";
  t.desc = t.desc||"";
  t.assignee = t.assignee||owner;
  if(t.est===undefined) t.est=1;
  if(!Array.isArray(t.points)) t.points=[];
  if(t.notes===undefined) t.notes="";
  if(!Array.isArray(t.images)) t.images=[];
  return t;
}

/* ---------- story hierarchy: User Story → Sub-story → Tasks ----------
   Migrates the old flat model (story.tasks) into sub-stories, gives every
   user story a lead + manager (default = project owner), and normalizes
   p.backlog + every sprint task into the unified task shape. */
function normalizeProject(p){
  if(!p) return p;
  // Student-card media. Set before the sprints guard below so projects saved
  // before v0.11 migrate even if they have no sprints array yet.
  // Shape: {url,name} or null — same as a task image entry.
  if(p.banner===undefined) p.banner=null;
  if(p.portrait===undefined) p.portrait=null;
  if(!Array.isArray(p.sprints)) return p;
  const owner = p.student || "";
  p.sprints.forEach(sp=>{
    (sp.stories||[]).forEach(st=>{
      if(st.lead===undefined||st.lead==="") st.lead = st.lead || owner;
      if(st.manager===undefined) st.manager = owner;
      if(st.active===undefined) st.active = true;   // pre-0.12 stories are all live
      if(!Array.isArray(st.subStories)){
        const tasks = Array.isArray(st.tasks)? st.tasks : [];
        st.subStories = [{id:uid(), title:"", tasks:tasks}];
      }
      if('tasks' in st) delete st.tasks;
      st.subStories.forEach(ss=>{
        if(!Array.isArray(ss.tasks)) ss.tasks=[];
        if(ss.title===undefined) ss.title="";
        ss.tasks.forEach(t=>normalizeTaskShape(t,owner));
      });
    });
  });
  p.backlog = (Array.isArray(p.backlog)? p.backlog : []).map(b=>normalizeTaskShape(b,owner));
  return p;
}
function normalizeAll(){ (state.projects||[]).forEach(normalizeProject); }
/* Locate a task by id anywhere in state (sprints or backlog) →
   {p,sp,st,ss,idx,t,inBacklog}. */
function locateTask(tid){
  for(const p of state.projects) for(const sp of (p.sprints||[])) for(const st of (sp.stories||[])) for(const ss of (st.subStories||[])){
    const idx=(ss.tasks||[]).findIndex(t=>t.id===tid);
    if(idx>=0) return {p,sp,st,ss,idx,t:ss.tasks[idx]};
  }
  for(const p of state.projects){
    const idx=(p.backlog||[]).findIndex(t=>t.id===tid);
    if(idx>=0) return {p,sp:null,st:null,ss:null,idx,t:p.backlog[idx],inBacklog:true};
  }
  return null;
}

/* ---------- date helpers ---------- */
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function fmt(iso){const d=new Date(iso+"T12:00:00");return (d.getMonth()+1)+"/"+d.getDate();}
function fmtDow(iso){return ["S","M","T","W","T","F","S"][new Date(iso+"T12:00:00").getDay()];}
function sprintDatesFrom(startISO){
  let out=[],s=startISO;
  for(const w of SPRINT_WEEKS){const days=w*7;out.push({start:s,end:addDays(s,days-1)});s=addDays(s,days);}
  return out;
}
function sprintDates(){ return sprintDatesFrom(QUARTER_START); }
function nextMonday(){
  const d=new Date(); const day=d.getDay(); // 0 Sun..6 Sat
  const add=((8-day)%7)||7; d.setDate(d.getDate()+add);
  return d.toISOString().slice(0,10);
}
function sprintDatesFromLengths(startISO,lengths){
  let out=[],s=startISO;
  const ls=(Array.isArray(lengths)&&lengths.length)?lengths:SPRINT_WEEKS;
  for(const w of ls){const days=Math.max(1,Math.round(w*7));out.push({start:s,end:addDays(s,days-1)});s=addDays(s,days);}
  return out;
}
function classSchedule(){
  const s=state.settings||{};
  return {
    start: (s.sprintStart&&/^\d{4}-\d{2}-\d{2}$/.test(s.sprintStart))? s.sprintStart : nextMonday(),
    lengths: (Array.isArray(s.sprintLengths)&&s.sprintLengths.length)? s.sprintLengths.slice() : SPRINT_WEEKS.slice()
  };
}
function daysOf(sp){let out=[],d=sp.start;while(d<=sp.end){out.push(d);d=addDays(d,1);}return out;}

/* ---------- sample-data generation ---------- */
function genBurn(nDays,est,progress){ // progress 0..1 → how much of sprint elapsed/burned
  const pts=[];let v=est;
  const doneDay=Math.round(nDays*progress);
  for(let i=0;i<nDays;i++){
    if(i>0&&i<=doneDay&&v>0&&Math.random()<(est/Math.max(doneDay,1))*0.9) v=Math.max(0,v-1);
    if(i>doneDay&&progress>=1)v=0;
    pts.push(v);
  }
  if(progress>=1)pts[nDays-1]=0;
  return pts;
}
function mkTask(cat,desc,assignee,status,est,nDays,progress){
  return {id:uid(),cat,desc,assignee,status,est,points:genBurn(nDays,est,progress),notes:"",images:[]};
}
function mkSprint(num,name,goal,dates){
  return {id:uid(),num,name,goal,start:dates.start,end:dates.end,stories:[]};
}
function sampleData(){
  /* DEMO DATA ONLY — every name below is fictional, on purpose.
     ---------------------------------------------------------------------
     index.html is served to ANONYMOUS visitors as the sign-in shell, so
     anything written here is readable via View Source by anyone with the
     URL, signed in or not. This function previously held the real FA26
     roster, which meant the class list was public despite the passphrase
     gate on data/roster.json — the lock was on the door and the window was
     open.

     Never put a real student name in this file. The real roster lives in
     data/roster.json, behind auth, and reaches the browser only through
     get_state. tests/client.test.js greps this file's raw source for roster
     surnames and fails if any reappear. --------------------------------- */
  const SD=sprintDates();
  const roster=migrateRoster([
    "Prof. Chiu",
    "Ada Lovelace",
    "Roberta Williams",
    "Hideo Kojima",
    "Alan Turing",
    "Shigeru Miyamoto",
    "Grace Hopper",
    "Katherine Johnson",
    "Alan Kay",
    "Radia Perlman",
    "Barbara Liskov",
    "Margaret Hamilton",
    "Donald Knuth",
    "Jane Jensen",
    "Yu Suzuki"
  ]);

  /* --- Project 1 : Environment (rich sample) --- */
  const p1={id:uid(),student:"Shigeru Miyamoto",title:"Ancient Cistern",type:"Environment",
    links:[{label:"Course Outcome Site",url:"https://sites.google.com/view/gamestudiofa26/overview"},{label:"Mood Board",url:"https://pinterest.com"}],
    backlog:[
      {id:uid(),cat:"Art",desc:"Hero prop — bronze water valve",pts:3},
      {id:uid(),cat:"Art",desc:"Decal pass: moss + water stains",pts:2},
      {id:uid(),cat:"Tech",desc:"Vertex-paint puddle shader",pts:2},
      {id:uid(),cat:"Design",desc:"Second camera composition for reel",pts:1}
    ],
    sprints:[]};
  const goals=[
    "Pitch, references, moodboard, blockout of main chamber",
    "Full greybox + lighting study, modular kit list",
    "Modular kit: trim sheets + first texture set",
    "Hero assets modeled + retopology",
    "Set dressing, materials, FX pass",
    "Final lighting, polish, reel + post-mortem"
  ];
  const names=["Discovery & Blockout","Greybox & Lighting Study","Modular Kit","Hero Assets","Set Dressing & FX","Polish & Presentation"];
  for(let i=0;i<6;i++)p1.sprints.push(mkSprint(i+1,names[i],goals[i],SD[i]));

  // sprint 1 (finished)
  let n=daysOf(p1.sprints[0]).length;
  p1.sprints[0].stories=[
    {id:uid(),title:"As a viewer, I understand the vision of the environment",lead:"Shigeru Miyamoto",tasks:[
      mkTask("Design","Collect 40+ reference images","Shigeru Miyamoto","Approved",2,n,1),
      mkTask("Design","Write one-page pitch","Shigeru Miyamoto","Approved",1,n,1),
      mkTask("Art","Moodboard & color script","Shigeru Miyamoto","Approved",2,n,1)]},
    {id:uid(),title:"As a player, I can walk through a blocked-out main chamber",lead:"Shigeru Miyamoto",tasks:[
      mkTask("Art","Blockout main chamber in UE5","Shigeru Miyamoto","Approved",3,n,1),
      mkTask("Tech","Scale check with mannequin","Shigeru Miyamoto","Approved",1,n,1),
      mkTask("Design","Camera flythrough path","Shigeru Miyamoto","Completed",2,n,1)]}
  ];
  // sprint 2 (finished)
  n=daysOf(p1.sprints[1]).length;
  p1.sprints[1].stories=[
    {id:uid(),title:"As a viewer, I can read the space in a lighting keyframe",lead:"Shigeru Miyamoto",tasks:[
      mkTask("Art","Full greybox all rooms","Shigeru Miyamoto","Approved",3,n,1),
      mkTask("Art","3 lighting studies (day/dusk/torch)","Shigeru Miyamoto","Approved",3,n,1),
      mkTask("Design","Modular kit breakdown list","Shigeru Miyamoto","Approved",2,n,1),
      mkTask("Art","Draw-over paint on greybox shots","Shigeru Miyamoto","Backburner",2,n,.6)]}
  ];
  // sprint 3 (current)
  n=daysOf(p1.sprints[2]).length;
  p1.sprints[2].stories=[
    {id:uid(),title:"As an artist, I can build 80% of the space from the modular kit",lead:"Shigeru Miyamoto",tasks:[
      mkTask("Art","Trim sheet 01 — stone & bronze","Shigeru Miyamoto","In Progress",3,n,.5),
      mkTask("Art","Pillar + arch modular set","Shigeru Miyamoto","In Progress",3,n,.4),
      mkTask("Tech","Master material with trim UV helper","Shigeru Miyamoto","Completed",2,n,.7),
      mkTask("Art","Floor tile set (3 variants)","Shigeru Miyamoto","Not Started",2,n,0)]}
  ];

  /* --- Project 2 : Character --- */
  const p2={id:uid(),student:"Roberta Williams",title:"Mireborn Knight",type:"Character",
    links:[{label:"Course Outcome Site",url:"https://sites.google.com/view/game-405/home"}],

/* =========================================================
   BACKEND MODES — one file, three deployments.

   This file is Version A, B and C at once. It works out at boot which one it
   is and routes every api.php call accordingly:

     SERVER  api.php is reachable  -> the SCAD build. Passphrase, roles,
                                      private notes, uploads, daily backups.
     CLOUD   G405_FIREBASE.dbUrl set -> shared via Firebase. No passphrase;
                                      the data is public by design decision.
     LOCAL   neither                -> this browser's own storage. One machine,
                                      no network, no accounts. The safety net.

   The trick that keeps this cheap: the local and cloud backends speak the SAME
   protocol as api.php. apiFetch() hands them "api.php?action=save_project" and
   they answer with a Response-shaped object. So all ~28 call sites, the 401
   handling, the polling loop and the error paths are untouched, and SERVER mode
   runs the identical code it always did.

   Features that need a real server (uploads, backups, private notes, roles)
   report 501 in the other two modes, and their buttons are hidden — see
   modeHas(). Never add a feature that silently no-ops instead.
   ========================================================= */

/* Version B switch. Paste the Firebase Realtime Database URL here — something
   like "https://your-project-default-rtdb.firebaseio.com" — and this file
   becomes the shared cloud build on next load. Empty means "not cloud".

   Do not fill this in by hand in the master copy: it would flip the A and C
   builds to cloud mode too. Put the URL in firebase-url.txt and run
   build-versions.command, which injects it into versions/B-cloud only.
   Console setup is Part 3 of HANDBOOK.md. */
const G405_FIREBASE = { dbUrl: "https://game405-sprint-default-rtdb.firebaseio.com/" };

let BACKEND_MODE = "server";               // decided by detectBackendMode()
let lastBackendError = "";                 // shown on the failure screen, so a
                                           // dead database says WHY on screen
                                           // rather than only in the console
const LOCAL_KEY  = "g405_local_v1";        // Version C's whole database

/* api.php stamps updatedAt with date('Y-m-d H:i:s'). The local and cloud
   backends MUST produce the same shape: the three backends being
   protocol-identical is the whole reason the rest of the app does not know
   which one it is talking to. Stamping a raw epoch number here instead reached
   timeAgo() as a number, threw inside render(), and blanked the entire app. */
function stampNow() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
         p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

/* What each mode can actually do. The UI asks before rendering a button, so
   nothing on screen leads to a 501. */
function modeHas(feature) {
  if (BACKEND_MODE === "server") return true;
  // Everything below needs either a session or server-side file storage.
  return ["auth", "roles", "notes", "backups", "uploads", "viewAs"].indexOf(feature) === -1;
}

/* Version A uploads a file; B and C take a link to an image that is already
   online. Both routes hang off the SAME three entry points — banner, portrait,
   card image — so clicking one never dead-ends. It used to: the old NO_UPLOADS
   alert told you to paste a URL and then offered nowhere to paste it, which is
   worse than a missing feature because it reads like a bug in the app.

   https only, matching the task-image field at #td-img-add. An http:// image
   on an https:// page is blocked as mixed content, so it would arrive as a
   broken box with nothing on screen explaining why. */
function promptImageUrl(what){
  const raw = prompt(
    "Paste a link to " + what + ".\n\n" +
    "It has to be an image that is already online — in most browsers, " +
    "right-click the image and choose Copy Image Address.\n\n" +
    "Uploading a file from this computer needs the server build.", "https://");
  if(raw===null) return null;                       // cancelled
  const url = String(raw).trim();
  if(!url || url==="https://") return null;         // cancelled by clearing it
  if(!/^https:\/\//i.test(url)){ alert("Image URL must start with https://"); return null; }
  return { url: url, name: url.split("/").pop() || url };
}

/* A Response, as much of one as apiFetch and its callers actually use. */
function fauxResponse(status, data) {
  const body = JSON.stringify(data);
  const r = {
    ok: status >= 200 && status < 300,
    status: status,
    json: async () => JSON.parse(body),
    text: async () => body
  };
  r.clone = () => r;
  return r;
}

/* ---------- Version C — the browser's own storage ----------
   One key holds the entire class. localStorage is a cache, not the archive:
   a file:// page's storage is tied to the exact path of the file, so moving or
   renaming index.html loses it. Export to JSON is the real save — see
   exportClassJSON(). */
const LocalBackend = {
  read() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (!raw) return { roster: [], projects: [], settings: {} };
      const db = JSON.parse(raw);
      return {
        roster: db.roster || [],
        projects: db.projects || [],
        settings: db.settings || {}
      };
    } catch (e) {
      console.error("Local database unreadable, starting empty:", e);
      return { roster: [], projects: [], settings: {} };
    }
  },
  write(db) {
    try {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(db));
      return true;
    } catch (e) {
      // Quota, or Safari in private mode. Silence here would look like a save
      // that worked, which is the one outcome worth shouting about.
      console.error("Local save FAILED:", e);
      alert("Could not save to this browser's storage.\n\n" +
            "Your work is still on screen but is NOT saved. Use Manage → " +
            "Export class JSON right now to keep it.");
      return false;
    }
  },
  handle(action, params, body) {
    const db = this.read();

    if (action === "status")
      return fauxResponse(200, { configured: true, authenticated: true,
                                 role: "manager", trueRole: "manager",
                                 version: APP_VERSION, mode: "local" });

    if (action === "get_state")
      return fauxResponse(200, { roster: db.roster, projects: db.projects,
                                 settings: db.settings, role: "manager",
                                 trueRole: "manager", managerLocked: false });

    if (action === "save_project") {
      const p = JSON.parse(body);
      p.updatedAt = stampNow();
      const i = db.projects.findIndex(x => x.id === p.id);
      if (i === -1) db.projects.push(p); else db.projects[i] = p;
      this.write(db);
      return fauxResponse(200, p);
    }

    if (action === "delete_project") {
      db.projects = db.projects.filter(x => x.id !== params.get("id"));
      this.write(db);
      return fauxResponse(200, { ok: true });
    }

    if (action === "save_roster") {
      db.roster = JSON.parse(body);
      this.write(db);
      return fauxResponse(200, { ok: true });
    }

    if (action === "save_settings") {
      db.settings = JSON.parse(body);
      this.write(db);
      return fauxResponse(200, { ok: true });
    }

    if (action === "logout") return fauxResponse(200, { ok: true });

    // Everything else genuinely needs a server. Say so rather than pretend.
    return fauxResponse(501, { error: "Not available in " + BACKEND_MODE + " mode" });
  }
};

/* ---------- the router the other two modes share ---------- */
function offlineFetch(url, opts) {
  const q      = String(url).indexOf("?");
  const params = new URLSearchParams(q === -1 ? "" : String(url).slice(q + 1));
  const action = params.get("action") || "";
  const body   = opts && opts.body ? opts.body : null;

  // FormData means a file upload, which neither mode supports.
  if (body && typeof body !== "string")
    return Promise.resolve(fauxResponse(501, { error: "Uploads need the server build" }));

  if (BACKEND_MODE === "cloud") return CloudBackend.handle(action, params, body);
  return Promise.resolve(LocalBackend.handle(action, params, body));
}

/* ---------- which mode are we in? ----------
   Order matters. An explicit Firebase URL always wins; otherwise we ask api.php
   and fall back to local when it does not answer with JSON — which covers the
   file:// case (fetch throws immediately), a dead host, and the exact failure
   this whole arrangement exists for: a server that returns 500 to every PHP
   request. */
async function detectBackendMode() {
  if (G405_FIREBASE.dbUrl) { BACKEND_MODE = "cloud"; return "cloud"; }
  try {
    const res = await fetch("api.php?action=status", { credentials: "same-origin" });
    const s   = await res.json();       // throws on a 500's HTML error page
    if (s && typeof s === "object") { BACKEND_MODE = "server"; return "server"; }
  } catch (e) {
    console.info("api.php did not answer — running on local storage.", e.message);
  }
  BACKEND_MODE = "local";
  return "local";
}

/* ---------- Version B — Firebase Realtime Database ----------

   Talks to Firebase over its plain REST interface: GET / PATCH against a
   `.json` URL. No SDK, no CDN script, no build step, so the single-file rule
   survives intact. Set G405_FIREBASE.dbUrl at the top of this file and the app
   becomes the shared cloud build on the next load.

   TWO DELIBERATE CHOICES, both worth understanding before changing anything.

   1. Projects, the roster and the settings are each stored as a JSON *string*,
      not as a Firebase tree. Firebase silently rewrites structure on the way
      through: it deletes keys whose value is null, stores an empty array as
      "absent", and returns a sparse array as an object with numeric keys. The
      daily grid is exactly that — points-remaining per day, with holes for the
      days nobody filled in — so a round trip through a Firebase tree would
      quietly corrupt the burndown charts. Storing the JSON verbatim means what
      comes back is byte-identical to what went in, the same guarantee api.php
      gives. The cost is that the Firebase console shows one long line per
      project instead of a browsable tree. Worth it.

   2. A tiny `/index` node holds one timestamp per project, and polling reads
      only that. Re-downloading the whole class every 10 seconds in 16 browsers
      at once would burn through Firebase's free tier in about two class
      sessions; the index is ~600 bytes a poll, and only the projects whose
      timestamp actually moved get fetched.

   No passphrase and no roles — anyone with the URL can read and write, which is
   the professor's explicit decision for this build. Private notes are excluded
   entirely (see modeHas), because there is nothing here to protect them with.
   ========================================================= */
const CloudBackend = {
  /* Everything downloaded so far, so a poll only fetches what changed:
     {roster, settings, projects:{id:project}, stamps:{id:rev}, rosterAt, settingsAt} */
  cache: null,

  /* The /index node holds one of these per record. It is deliberately NOT
     updatedAt: that is a display value with only second resolution, so two
     saves inside the same second looked identical and other browsers stopped
     re-downloading. A revision token only has to be different every time. */
  rev() { return Date.now() + "-" + uid(); },

  url(path) {
    return G405_FIREBASE.dbUrl.replace(/\/+$/, "") + "/" + path + ".json";
  },

  /* One REST call. Throws on anything that is not a 2xx so every caller can
     assume success; handle() turns the throw into a 503 the app understands. */
  async req(method, path, payload) {
    const opts = { method: method };
    if (payload !== undefined) {
      opts.body = JSON.stringify(payload);
      opts.headers = { "Content-Type": "application/json" };
    }
    const res = await fetch(this.url(path), opts);
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.text()).slice(0, 200); } catch (e) {}
      throw new Error("Firebase returned " + res.status + " for " + method + " /" +
                      path + (detail ? " — " + detail : ""));
    }
    const txt = await res.text();
    return txt === "" ? null : JSON.parse(txt);
  },

  /* A stored record is a JSON string. Anything else means the node was written
     by hand in the console, or half-written; fall back rather than crash the
     whole class board over one bad record. */
  decode(raw, fallback) {
    if (typeof raw !== "string") return fallback;
    try { return JSON.parse(raw); }
    catch (e) { console.error("Unreadable record in Firebase:", e); return fallback; }
  },

  /* Firebase hands back an ARRAY rather than an object whenever the keys happen
     to look like array indices. Project ids are random base-36, so this is
     unlikely rather than impossible — normalise both shapes to {id: stamp}. */
  stamps(node) {
    const out = {};
    if (!node || typeof node !== "object") return out;
    if (Array.isArray(node)) {
      node.forEach((v, i) => { if (v !== null && v !== undefined) out[String(i)] = v; });
      return out;
    }
    Object.keys(node).forEach(k => { out[k] = node[k]; });
    return out;
  },

  /* Read the index, then fetch only what the index says has moved. */
  async loadAll() {
    const idx   = (await this.req("GET", "index")) || {};
    const cold  = !this.cache;
    const c     = this.cache || { roster: [], settings: {}, projects: {}, stamps: {},
                                  rosterAt: null, settingsAt: null };

    const rosterAt = idx.rosterAt || null;
    if (cold || c.rosterAt !== rosterAt)
      c.roster = this.decode(await this.req("GET", "roster"), []);
    c.rosterAt = rosterAt;

    const settingsAt = idx.settingsAt || null;
    if (cold || c.settingsAt !== settingsAt)
      c.settings = this.decode(await this.req("GET", "settings"), {});
    c.settingsAt = settingsAt;

    // Rebuild the project map from the index, so an id the index no longer
    // lists is dropped — that is how a delete reaches the other browsers.
    const stamps = this.stamps(idx.projects);
    const next = {}, seen = {};
    for (const id of Object.keys(stamps)) {
      if (c.projects[id] && c.stamps[id] === stamps[id]) {
        next[id] = c.projects[id]; seen[id] = stamps[id]; continue;
      }
      const p = this.decode(await this.req("GET", "projects/" + id), null);
      if (p) { next[id] = p; seen[id] = stamps[id]; }
    }
    c.projects = next;
    c.stamps   = seen;

    this.cache = c;
    return c;
  },

  async handle(action, params, body) {
    if (action === "status")
      return fauxResponse(200, { configured: true, authenticated: true,
                                 role: "manager", trueRole: "manager",
                                 version: APP_VERSION, mode: "cloud" });

    if (action === "logout") return fauxResponse(200, { ok: true });

    try {
      if (action === "get_state") {
        let c;
        try {
          c = await this.loadAll();
        } catch (e) {
          // A poll that fails must not blank a board that is on screen and
          // correct. 304 is exactly "nothing new to tell you", and the polling
          // loop already knows to leave the page alone.
          if (this.cache) { console.warn("Cloud poll failed, keeping what we have:", e.message); return fauxResponse(304, {}); }
          throw e;
        }
        return fauxResponse(200, {
          roster: c.roster, projects: Object.keys(c.projects).map(k => c.projects[k]),
          settings: c.settings, role: "manager", trueRole: "manager",
          managerLocked: false
        });
      }

      if (action === "save_project") {
        const p = JSON.parse(body);
        // Stamped by whichever browser saved, not by Firebase. Only ever
        // compared for inequality, so a few seconds of clock skew between
        // student machines changes nothing.
        p.updatedAt = stampNow();
        const rev = this.rev();
        const patch = {};
        patch["projects/" + p.id]       = JSON.stringify(p);
        patch["index/projects/" + p.id] = rev;
        await this.req("PATCH", "", patch);
        if (this.cache) { this.cache.projects[p.id] = p; this.cache.stamps[p.id] = rev; }
        return fauxResponse(200, p);
      }

      if (action === "delete_project") {
        const id = params.get("id");
        const patch = {};
        patch["projects/" + id]       = null;   // null deletes the node
        patch["index/projects/" + id] = null;
        await this.req("PATCH", "", patch);
        if (this.cache) { delete this.cache.projects[id]; delete this.cache.stamps[id]; }
        return fauxResponse(200, { ok: true });
      }

      if (action === "save_roster") {
        const roster = JSON.parse(body);
        const at = this.rev();
        await this.req("PATCH", "", { roster: JSON.stringify(roster), "index/rosterAt": at });
        if (this.cache) { this.cache.roster = roster; this.cache.rosterAt = at; }
        return fauxResponse(200, { ok: true });
      }

      if (action === "save_settings") {
        const settings = JSON.parse(body);
        const at = this.rev();
        await this.req("PATCH", "", { settings: JSON.stringify(settings), "index/settingsAt": at });
        if (this.cache) { this.cache.settings = settings; this.cache.settingsAt = at; }
        return fauxResponse(200, { ok: true });
      }

      // Everything else genuinely needs a server. Say so rather than pretend.
      return fauxResponse(501, { error: "Not available in " + BACKEND_MODE + " mode" });

    } catch (e) {
      console.error("Cloud backend error:", e);
      lastBackendError = e.message || String(e);
      return fauxResponse(503, { error: lastBackendError });
    }
  }
};

/* =========================================================
   TRANSPORT — every call to api.php goes through apiFetch().

   Two jobs. First, it is the single place that notices the session has gone
   (401) and drops the whole app back to the sign-in screen, so an expired
   cookie can never leave the UI showing stale class data it can no longer
   save. Second, it keeps 403 distinct from 401: 403 means "signed in, wrong
   role" — an honest answer for the caller, not a reason to sign out.

   No headers, no tokens. The session cookie rides along automatically.
   ========================================================= */
let lockedOut = false;

async function apiFetch(url, opts) {
  // LOCAL and CLOUD answer the same protocol without a network round trip, and
  // never 401 — there is no session to expire, so the block below is skipped.
  if (BACKEND_MODE !== "server") return offlineFetch(url, opts);

  const res = await fetch(url, Object.assign({ credentials: "same-origin" }, opts || {}));
  if (res.status === 401) {
    let body = {};
    try { body = await res.clone().json(); } catch (e) {}
    handleSignedOut(body && body.error === "setup_required");
  }
  return res;
}
function jsonHeaders() { return { "Content-Type": "application/json" }; }

/* One-way door: something told us we are not signed in. Drop every scrap of
   class data from memory before painting the lock screen — leaving the roster
   in a JS variable behind a "locked" overlay is not locked. */
function handleSignedOut(setupRequired) {
  if (lockedOut) return;
  lockedOut = true;
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
  state.roster = []; state.projects = []; state.settings = {};
  state.role = "none"; state.trueRole = "none";
  state.configured = !setupRequired;
  cardState.notes = {}; cardState.notesLoaded = false;
  closeStudentCard();
  document.querySelectorAll(".overlay").forEach(el => el.remove());
  renderLock();
}

async function loadState() {
  try {
    const res = await apiFetch("api.php?action=get_state");
    if (!res.ok) return false;
    const data = await res.json();
    state.roster = migrateRoster(data.roster);
    state.projects = data.projects || [];
    normalizeAll();
    state.settings = data.settings || {};
    state.managerLocked = !!data.managerLocked;
    state.role = data.role || "none";
    state.trueRole = data.trueRole || state.role;

    state.currentUser = localStorage.getItem("g405_user") || fullName(state.roster[0]) || "";

    // Only auto-seed a truly fresh install (no roster, no projects, never initialized).
    // A clean-slate wipe sets settings.initialized so sample data never comes back.
    // Manager-only now: seeding writes the roster, which students cannot do, and
    // a student hitting a blank class would otherwise fire a burst of 403s.
    if (state.role === "manager" && state.projects.length === 0 && state.roster.length === 0
        && !(state.settings && state.settings.initialized)) {
      await seedDatabase();
    }
    return true;
  } catch (e) {
    console.error("Error loading state from server:", e);
    if (!lastBackendError) lastBackendError = e.message || String(e);
    return false;
  }
}

/* Turn a failed response into one sentence a person can act on. */
async function describeFailure(res, doing) {
  let msg = "";
  try { msg = ((await res.clone().json()) || {}).error || ""; } catch (e) {}
  if (!msg) { try { msg = (await res.clone().text() || "").slice(0, 200); } catch (e) {} }
  lastBackendError = "HTTP " + res.status + " while " + doing + (msg ? ": " + msg : "");
  return lastBackendError;
}

async function seedDatabase() {
  console.log("Seeding backend with default database...");
  const sample = sampleData();
  sample.projects.forEach(normalizeProject); // store in the sub-story model

  /* Every write here used to be assumed to work. When one did not, the error
     body was pushed into state.projects as though it were a project and the
     next render() walked into it — which surfaced as "the app failed to start"
     with no hint that the real problem was a rejected write. Check, and fail
     with whatever the backend actually said. */
  const rres = await apiFetch("api.php?action=save_roster", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(sample.roster)
  });
  if (!rres.ok) throw new Error(await describeFailure(rres, "saving the roster"));
  state.roster = sample.roster;

  for (const p of sample.projects) {
    const res = await apiFetch("api.php?action=save_project", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(p)
    });
    if (!res.ok) throw new Error(await describeFailure(res, "saving a project"));
    const saved = await res.json();
    state.projects.push(saved);
  }
  
  state.currentUser = localStorage.getItem("g405_user") || fullName(state.roster[0]) || "";
}

/* Autosave fires on every keystroke-ish edit, so a database that has gone away
   would otherwise raise one dialog per edit. One warning a minute is enough to
   be heard and few enough to be dismissable. */
let lastSaveAlert = 0;

async function saveProject(p) {
  try {
    const res = await apiFetch("api.php?action=save_project", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(p)
    });
    // A failed save used to fall through to res.json() and hand the error body
    // back as if it were the saved project, which silently replaced real work
    // with {"error": ...}. Stop here instead, and in the modes where there is no
    // second copy of the data, say so out loud.
    if (!res.ok) {
      let msg = "";
      try { msg = ((await res.clone().json()) || {}).error || ""; } catch (e) {}
      console.error("Save failed:", res.status, msg);
      if (BACKEND_MODE !== "server" && Date.now() - lastSaveAlert > 60000) {
        lastSaveAlert = Date.now();
        alert("That change did NOT save.\n\n" +
              (msg || "The database could not be reached.") +
              "\n\nYour work is still on screen. Check your internet connection, " +
              "and use Manage \u2192 Export class JSON to keep a copy before closing this tab.");
      }
      return null;
    }
    const saved = await res.json();
    normalizeProject(saved);
    const idx = state.projects.findIndex(x => x.id === p.id);
    if (idx !== -1) {
      state.projects[idx] = saved;
    } else {
      // A NEW project. This used to be dropped on the floor: the server had it
      // but local state did not, so nothing appeared until the next poll — and
      // clicking again made another one. Every extra click was a duplicate.
      state.projects.push(saved);
    }
    return saved;
  } catch (e) {
    console.error("Error saving project to server:", e);
    return null;
  }
}

/* ---------- polling ---------- */
function hasActiveInput() {
  const el = document.activeElement;
  if (!el) return false;
  const tag = el.tagName.toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select';
}

let pollInterval = null;
function startPolling() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    // Pause polling while interacting, a modal or student card is open, or a drag is in progress.
    // The student card is excluded because incoming state would re-render the board underneath it
    // and stomp fields the professor is part-way through editing.
    if (lockedOut) return;
    if (hasActiveInput() || document.querySelector(".overlay") || document.querySelector(".scard") || isDragging) return;
    try {
      const res = await apiFetch("api.php?action=get_state");
      // 304: the server's ETag matched, so nothing has changed since the last
      // poll and there is no body to read. The common case once the class
      // settles down — cheap enough that the 10s interval costs nothing.
      if (res.status === 304) return;
      if (!res.ok) return;
      const data = await res.json();
      let changed = false;
      if (data.role && data.role !== state.role) { state.role = data.role; changed = true; }
      if (data.trueRole) state.trueRole = data.trueRole;

      const incomingRoster = migrateRoster(data.roster);
      if (JSON.stringify(incomingRoster) !== JSON.stringify(state.roster)) {
        state.roster = incomingRoster;
        changed = true;
      }

      if (data.settings && JSON.stringify(data.settings) !== JSON.stringify(state.settings)) {
        state.settings = data.settings;
        changed = true;
      }
      state.managerLocked = !!data.managerLocked;

      if (data.projects) {
        if (data.projects.length !== state.projects.length) {
          state.projects = data.projects;
          normalizeAll();
          changed = true;
        } else {
          // Compare content, not just updatedAt: that stamp has one-second
          // resolution, so two edits landing in the same second used to look
          // identical here and the board silently kept showing the older one.
          for (const dp of data.projects) {
            const sp = state.projects.find(x => x.id === dp.id);
            if (!sp || JSON.stringify(sp) !== JSON.stringify(dp)) {
              changed = true;
              break;
            }
          }
          if (changed) {
            state.projects = data.projects;
            normalizeAll();
          }
        }
      }
      
      if (changed) {
        render();
      }
    } catch (e) {
      console.error("Polling error:", e);
    }
  }, 10000);
}

/* ---------- modal helper ---------- */
/* ---------- dialog policy ----------
   Every dialog in the app is STICKY: clicking the backdrop does nothing, so a
   stray click can never discard something half-typed. The only ways out are the
   dialog's own buttons (Save / Done / Cancel / Close) and Esc.

   Esc is wired at the document in the capture phase rather than on the overlay,
   because a backdrop click moves focus out of the modal and an overlay-scoped
   listener would then never fire. Returns the close function to use. */
function stickyDialog(ov,doClose){
  // stopImmediatePropagation, not stopPropagation: the student card also listens
  // for Esc on document, and it decides by looking for an open .overlay. close()
  // removes that overlay synchronously, so a surviving handler would look, see
  // nothing, and close the card too — one Esc dismissing two things.
  const onKey=e=>{ if(e.key==="Escape"){ e.stopImmediatePropagation(); close(); } };
  const close=()=>{ document.removeEventListener("keydown",onKey,true); doClose(); };
  document.addEventListener("keydown",onKey,true);
  return close;
}

function openForm(title,fields,onSubmit){
  const ov=document.createElement("div");ov.className="overlay";
  /* f.label is authored HERE, in code, and a few labels carry deliberate
     entities — so it is interpolated as-is. Everything else (values, options,
     placeholders) can be student text: "Edit project" seeds f.value from
     p.title, so an unescaped value was a quote away from breaking out of the
     attribute and running. Those all go through esc(). */
  ov.innerHTML=`<div class="modal"><h3>${title}</h3><form id="mf">
    ${fields.map(f=>{
      if(f.type==="note")return `<div class="sub" style="margin:2px 0 6px;line-height:1.5">${f.label}</div>`;
      if(f.type==="select")return `<label>${f.label}</label><select name="${esc(f.name)}">${f.options.map(o=>`<option value="${esc(o)}" ${o===f.value?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
      if(f.type==="textarea")return `<label>${f.label}</label><textarea name="${esc(f.name)}" rows="3">${esc(f.value||"")}</textarea>`;
      return `<label>${f.label}</label><input name="${esc(f.name)}" type="${esc(f.type||"text")}" value="${esc(f.value!==undefined?f.value:"")}" ${f.ph?`placeholder="${esc(f.ph)}"`:""}>`;
    }).join("")}
    <div class="actions"><button type="button" class="btn" id="mc">Cancel</button><button class="btn primary">Save</button></div>
  </form></div>`;
  document.body.appendChild(ov);
  ov.querySelector("input,select,textarea")?.focus();
  const close=stickyDialog(ov,()=>ov.remove());   // no backdrop dismissal
  ov.querySelector("#mc").onclick=close;
  ov.querySelector("#mf").onsubmit=e=>{
    e.preventDefault();
    const data={};new FormData(e.target).forEach((v,k)=>data[k]=v.trim());
    close();onSubmit(data);
  };
}

/* ---------- burndown math ---------- */
function subTasks(ss){ return Array.isArray(ss&&ss.tasks)? ss.tasks : []; }
function storySubs(st){ return Array.isArray(st&&st.subStories)? st.subStories : (Array.isArray(st&&st.tasks)? [{id:"_legacy",title:"",tasks:st.tasks}] : []); }
function storyActive(st){ return !st || st.active!==false; }   // default true for pre-0.12 files
/* Tasks that count: totals, burndown, done/total counts everywhere.
   Inactive (parked) stories drop out of the math entirely. */
function sprintTasks(sp){ return (sp.stories||[]).filter(storyActive).flatMap(st=>storySubs(st).flatMap(subTasks)); }
/* Every task regardless of active state. Use for STRUCTURAL work — resizing
   points[] when sprint dates change — otherwise a parked story's arrays go
   stale and break the moment it is switched back on. */
function allSprintTasks(sp){ return (sp.stories||[]).flatMap(st=>storySubs(st).flatMap(subTasks)); }
function seriesFor(sp,filterCat){
  const days=daysOf(sp);
  const tasks=sprintTasks(sp).filter(t=>!filterCat||t.cat===filterCat);
  return days.map((d,i)=>tasks.reduce((a,t)=>a+(t.points[i]??t.points[t.points.length-1]??0),0));
}
function lastVisibleIdx(sp){
  const days=daysOf(sp);
  if(todayISO<sp.start)return -1;
  if(todayISO>=sp.end)return days.length-1;
  return days.findIndex(d=>d===todayISO);
}
function drawBurn(cv,sp){
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const c=cv.getContext("2d");c.scale(dpr,dpr);
  const days=daysOf(sp);
  const total=seriesFor(sp);
  const max=Math.max(...total,1);
  const padL=26,padR=8,padT=10,padB=20;
  const x=i=>padL+(W-padL-padR)*(days.length<2?0:i/(days.length-1));
  const y=v=>padT+(H-padT-padB)*(1-v/max);
  c.clearRect(0,0,W,H);
  // grid
  c.strokeStyle="#f0f0f2";c.lineWidth=1;c.font="10px sans-serif";c.fillStyle="#a1a1aa";
  for(let g=0;g<=3;g++){const v=max*g/3;c.beginPath();c.moveTo(padL,y(v));c.lineTo(W-padR,y(v));c.stroke();c.fillText(Math.round(v),4,y(v)+3);}
  // x labels (sparse)
  const step=Math.ceil(days.length/8);
  days.forEach((d,i)=>{if(i%step===0||i===days.length-1)c.fillText(fmt(d),x(i)-8,H-6);});
  // today marker
  const ti=days.indexOf(todayISO);
  if(ti>=0){c.strokeStyle="#c7d2fe";c.setLineDash([3,3]);c.beginPath();c.moveTo(x(ti),padT);c.lineTo(x(ti),H-padB);c.stroke();c.setLineDash([]);}
  // ideal
  c.strokeStyle="#d4d4d8";c.lineWidth=1.5;c.setLineDash([5,4]);
  c.beginPath();c.moveTo(x(0),y(total[0]));c.lineTo(x(days.length-1),y(0));c.stroke();c.setLineDash([]);
  // lines
  const draw=(vals,color,thick)=>{
    const li=lastVisibleIdx(sp);if(li<0)return;
    c.strokeStyle=color;c.lineWidth=thick;c.beginPath();
    for(let i=0;i<=li;i++){i?c.lineTo(x(i),y(vals[i])):c.moveTo(x(i),y(vals[i]));}
    c.stroke();
    c.fillStyle=color;c.beginPath();c.arc(x(li),y(vals[li]),3,0,7);c.fill();
  };
  draw(seriesFor(sp,"Design"),"#818cf8",1.3);
  draw(seriesFor(sp,"Art"),"#f59e0b",1.3);
  draw(seriesFor(sp,"Tech"),"#3b82f6",1.3);
  draw(total,"#18181b",2.2);
}
function drawSpark(cv,sp){
  if(!sp){return;}
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const c=cv.getContext("2d");c.scale(dpr,dpr);
  const total=seriesFor(sp),days=daysOf(sp);
  const max=Math.max(...total,1),li=lastVisibleIdx(sp);
  const x=i=>2+(W-4)*(days.length<2?0:i/(days.length-1)),y=v=>3+(H-6)*(1-v/max);
  c.strokeStyle="#d4d4d8";c.setLineDash([3,3]);c.beginPath();c.moveTo(x(0),y(total[0]));c.lineTo(x(days.length-1),y(0));c.stroke();c.setLineDash([]);
  if(li<0)return;
  c.strokeStyle="#4f46e5";c.lineWidth=1.6;c.beginPath();
  for(let i=0;i<=li;i++){i?c.lineTo(x(i),y(total[i])):c.moveTo(x(i),y(total[i]));}
  c.stroke();
}

/* ---------- relative time helper ---------- */
function timeAgo(value) {
  if (!value) return "Never";
  /* api.php sends 'Y-m-d H:i:s'. Accept a raw epoch number too: early cloud and
     local records hold one, and this runs on every row of the daily board — it
     is not allowed to be the thing that takes the whole app down again. */
  const d = typeof value === "number"
    ? new Date(value)
    : new Date(String(value).replace(" ", "T"));
  if (isNaN(d.getTime())) return "Unknown";
  const now = new Date();
  const diffMs = now - d;
  const diffMins = Math.round(diffMs / 60000);
  if (diffMins < 1) return "Just now";
  if (diffMins < 60) return diffMins + "m ago";
  const diffHours = Math.round(diffMins / 60);
  if (diffHours < 24) return diffHours + "h ago";
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + d.getHours().toString().padStart(2, '0') + ":" + d.getMinutes().toString().padStart(2, '0');
}

/* ---------- bytes formatter ---------- */
function formatBytes(bytes) {
  if (bytes === 0) return '0 Bytes';
  const k = 1024;
  const dm = 1;
  const sizes = ['Bytes', 'KB', 'MB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
}

/* ---------- backup date formatter ---------- */
function formatBackupDate(mtime) {
  const d = new Date(mtime * 1000);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
}

    </tbody>
  </table>
  `;
}

/* ---------- home sorting ----------
   VIEW ONLY, unlike the roster sort. Project order on disk is just whatever
   glob() returned, so there is nothing meaningful to persist an order into —
   sorting here only changes what you are looking at. The choice itself is
   remembered per browser so the board comes back the way you left it. */
let homeSort = (()=>{ try{ return JSON.parse(localStorage.getItem("g405_homesort")||"null")||{key:null,dir:1}; }
                      catch(e){ return {key:null,dir:1}; } })();
function setHomeSort(key){
  homeSort = (homeSort.key===key) ? {key, dir:-homeSort.dir} : {key, dir:1};
  localStorage.setItem("g405_homesort", JSON.stringify(homeSort));
  render();
}
function homeSortArrow(key){
  if(homeSort.key!==key) return '<span style="opacity:.3;font-weight:400"> ↕</span>';
  return homeSort.dir===1 ? ' ▲' : ' ▼';
}
/* Values the columns sort on. Projects with no sprint or no tasks get a
   sentinel so they clump at one end instead of scattering. */
function homeSortValue(p,key){
  const sp=currentSprint(p);
  const tasks=sp?sprintTasks(sp):[];
  switch(key){
    case "student": return (p.student||"").toLowerCase();
    case "project": return (p.title||"").toLowerCase();
    case "track":   return (p.type||"").toLowerCase();
    case "sprint":  return sp?sp.num:-1;
    case "tasks":   return tasks.length ? tasks.filter(t=>t.status==="Approved"||t.status==="Completed").length/tasks.length : -1;
    case "edit":    return p.updatedAt ? Date.parse(String(p.updatedAt).replace(" ","T"))||0 : 0;
    default: return 0;
  }
}
/* The single funnel both home views draw from — so filtering test-account
   projects out of the class board only has to happen in one place. */
function sortedProjects(){
  const list=visibleProjects().slice();
  if(!homeSort.key) return list;
  const d=homeSort.dir;
  return list.sort((a,b)=>{
    const x=homeSortValue(a,homeSort.key), y=homeSortValue(b,homeSort.key);
    if(typeof x==="number" && typeof y==="number") return (x-y)*d;
    return String(x).localeCompare(String(y),undefined,{sensitivity:"base",numeric:true})*d;
  });
}
function homeTh(key,label,align,extra){
  return `<td class="sortable-col" onclick="setHomeSort('${key}')"
    title="Sort by ${label.toLowerCase()}"
    style="font-weight:700; text-align:${align}; padding:6px 10px;${extra||""}">${label}${homeSortArrow(key)}</td>`;
}

}

/* ---------- project banner ----------
   Reads and writes the SAME p.banner the student card sets, so setting it in
   either place shows up in both. Click the band to pick an image. */
function projBanner(p){
  const b=p.banner;
  return `<div class="proj-banner" onclick="setProjectBanner('${p.id}')"
       title="${b?"Click to replace the project banner":"Click to add a project banner"}">

async function setProjectBanner(pid){
  const p=findProj(pid); if(!p) return;
  if(!modeHas("uploads")){
    const img=promptImageUrl("the project banner"); if(!img) return;
    p.banner=img;
    await saveProject(p);
    render();
    return;
  }
  pickImage(async file=>{
    if(file.size>5*1024*1024){ alert("Image exceeds the 5MB limit."); return; }
    try{
      const fd=new FormData(); fd.append("file",file);
      const res=await apiFetch("api.php?action=upload_image&project="+encodeURIComponent(p.id),{method:"POST",body:fd});
      const d=await res.json();
      if(!res.ok||!d.url){ alert(d.error||"Upload failed."); return; }
      const cur=findProj(pid)||p;
      cur.banner={url:d.url,name:d.name||file.name};
      await saveProject(cur);
      render();
    }catch(e){ alert("Upload failed."); }
  });

async function clearProjectBanner(pid){

/* Every new project gets the CLASS sprint calendar built in. Students never
   set sprint dates — the professor owns the schedule in Manage Mode, and a
   new board arrives already lined up with everyone else's. */
function classSprints(){

  return sprintDatesFromLengths(sched.start,sched.lengths)
    .map((frame,i)=>mkSprint(i+1,"Sprint "+(i+1),"",frame));
}

/* ---------- mutations ---------- */
function setTaskField(tid,f,v){
  const loc=locateTask(tid); if(!loc) return;
  loc.t[f]=v;
  saveProject(loc.p).then(render);
}
/* The cell you edit sets the rest of the row, in BOTH directions. The old rule
   only ever clamped downward, so a mistyped 0 dragged the rest of the sprint to
   zero and could never be undone — raising the cell back left the later days
   stranded. Carrying the value forward makes every edit correctable.
   Trade-off, deliberately accepted: editing a PAST day overwrites the days
   after it, including today's real figure. */
function setPoint(tid,i,v){
  const loc=locateTask(tid); if(!loc) return;
  let n=Math.max(0,parseInt(v)||0);
  loc.t.points[i]=n;
  for(let j=i+1;j<loc.t.points.length;j++) loc.t.points[j]=n;
  saveProject(loc.p).then(render);
}
/* reorder within a sub-story */
function moveTask(tid,dir){
  const loc=locateTask(tid); if(!loc) return;
  const j=loc.idx+dir; const arr=loc.ss.tasks;
  if(j<0||j>=arr.length) return;
  [arr[loc.idx],arr[j]]=[arr[j],arr[loc.idx]];
  saveProject(loc.p).then(render);
}
/* move a task to another sub-story (same sprint) or back to the backlog */
function moveTaskPrompt(tid){
  const loc=locateTask(tid); if(!loc||loc.inBacklog) return;
  const BACKLOG="__backlog__";
  const targets=[{id:BACKLOG, label:"↩ Backlog"}];
  loc.sp.stories.forEach(st=>storySubs(st).forEach(ss=>{
    if(ss.id!==loc.ss.id) targets.push({id:ss.id, label:(st.title||"Story").slice(0,40)+" › "+(ss.title||"(untitled sub-story)")});
  }));
  openForm("Move task to…",[
    {name:"target",label:"Destination",type:"select",options:targets.map(t=>t.label)}
  ],d=>{
    const tgt=targets.find(t=>t.label===d.target); if(!tgt) return;
    // remove from current
    loc.ss.tasks.splice(loc.idx,1);
    if(tgt.id===BACKLOG){
      if(!Array.isArray(loc.p.backlog)) loc.p.backlog=[];
      loc.p.backlog.push(loc.t);
    } else {
      // find target ss and push
      for(const st of loc.sp.stories){ const ss=storySubs(st).find(x=>x.id===tgt.id); if(ss){ ss.tasks.push(loc.t); break; } }
    }
    saveProject(loc.p).then(render);
  });
}

/* ---------- drag & drop (task rows + backlog rows, same project only) ---------- */
function locateSubStory(ssid){
  for(const p of state.projects) for(const sp of (p.sprints||[])) for(const st of (sp.stories||[])) for(const ss of storySubs(st)){
    if(ss.id===ssid) return {p,sp,st,ss};
  }
  return null;
}
function locateStory(stid){
  for(const p of state.projects) for(const sp of (p.sprints||[])) for(const st of (sp.stories||[])){
    if(st.id===stid) return {p,sp,st};
  }
  return null;
}

function taskDragEnd(){

}

function getDragTid(e){

/* Move a task into a sub-story (by id), inserted before `beforeTid` or appended
   if omitted. Regenerates points only when crossing into/out of the backlog
   or into a different sprint (§1.2) — same-sprint moves keep points as-is. */
function moveTaskToSubStory(tid,ssid,beforeTid){
  const loc=locateTask(tid); if(!loc) return;
  const dest=locateSubStory(ssid); if(!dest) return;
  if(loc.inBacklog) loc.p.backlog.splice(loc.idx,1);
  else loc.ss.tasks.splice(loc.idx,1);
  if(loc.inBacklog || loc.sp.id!==dest.sp.id){
    const n=daysOf(dest.sp).length;
    loc.t.points=Array(n).fill(loc.t.est||0);
  }
  let idx=dest.ss.tasks.length;
  if(beforeTid){ const bi=dest.ss.tasks.findIndex(x=>x.id===beforeTid); if(bi>=0) idx=bi; }
  dest.ss.tasks.splice(idx,0,loc.t);
  saveProject(dest.p).then(render);
}
/* Move a sprint task to the backlog (as-is, per §1.2), inserted before
   `beforeBid` or appended if omitted. */
function moveTaskToBacklog(tid,beforeBid){
  const loc=locateTask(tid); if(!loc||loc.inBacklog) return;
  loc.ss.tasks.splice(loc.idx,1);
  if(!Array.isArray(loc.p.backlog)) loc.p.backlog=[];
  let idx=loc.p.backlog.length;
  if(beforeBid){ const bi=loc.p.backlog.findIndex(x=>x.id===beforeBid); if(bi>=0) idx=bi; }
  loc.p.backlog.splice(idx,0,loc.t);
  saveProject(loc.p).then(render);
}
function dropOnTaskRow(e,ssid,beforeTid){
  e.preventDefault(); e.currentTarget.classList.remove('drop-hint');
  const tid=getDragTid(e); if(!tid||tid===beforeTid) return;
  moveTaskToSubStory(tid,ssid,beforeTid);
}
function dropOnSubStoryBar(e,ssid){
  e.preventDefault(); e.currentTarget.classList.remove('drop-hint');
  const tid=getDragTid(e); if(!tid) return;
  moveTaskToSubStory(tid,ssid,null);
}
/* Drop directly onto a User Story's black bar — the biggest, most obvious
   target. Uses the story's first sub-story, auto-creating one (matches
   existing "no sub-stories yet" fallback pattern) if it has none yet. */
function dropOnStoryBar(e,stid){
  e.preventDefault(); e.currentTarget.classList.remove('drop-hint');
  const tid=getDragTid(e); if(!tid) return;
  const dest=locateStory(stid); if(!dest) return;
  let ss=storySubs(dest.st)[0];
  if(!ss){
    ss={id:uid(),title:"",tasks:[]};
    if(!Array.isArray(dest.st.subStories)) dest.st.subStories=[];
    dest.st.subStories.push(ss);
  }
  moveTaskToSubStory(tid,ss.id,null);
}
function dropOnBacklogRow(e,beforeBid){
  e.preventDefault(); e.currentTarget.classList.remove('drop-hint');
  const tid=getDragTid(e); if(!tid||tid===beforeBid) return;
  const loc=locateTask(tid); if(!loc) return;
  if(loc.inBacklog){
    const arr=loc.p.backlog;
    const [item]=arr.splice(loc.idx,1);
    let idx=arr.length;
    const bi=arr.findIndex(x=>x.id===beforeBid);
    if(bi>=0) idx=bi;
    arr.splice(idx,0,item);
    saveProject(loc.p).then(render);
  } else {
    moveTaskToBacklog(tid,beforeBid);
  }
}
function dropOnBacklogSection(e){
  e.preventDefault(); e.currentTarget.classList.remove('drop-hint');
  const tid=getDragTid(e); if(!tid) return;
  const loc=locateTask(tid); if(!loc||loc.inBacklog) return;
  moveTaskToBacklog(tid,null);
}

/* ---------- rename a sprint (anyone) ----------
   Deliberately separate from editSprint(), which is manager-only.

   The two used to be one dialog, so a student could not rename their own
   sprint without the manager passphrase. That conflated two different things:
   the DATES are the class calendar and belong to the professor, but the NAME
   is the student describing their own work — the same category as the sprint
   goal, which has always been click-to-edit for everyone. "Sprint 3" being
   permanently called "Sprint 3" is exactly the kind of enforcement principle 3
   says not to build.

   Dates stay locked. Only the label is freed. */
function renameSprint(pid,sid){
  const p=findProj(pid); if(!p) return;
  const s=p.sprints.find(x=>x.id===sid); if(!s) return;
  openForm("Rename Sprint "+s.num,[
    {type:"note",label:"What you call this sprint is up to you — try naming it after what you are trying to finish, e.g. <i>Core Loop Proto</i> or <i>Juice Pass</i>. The dates stay on the class calendar."},
    {name:"name",label:"Sprint name",value:s.name||"",ph:"Sprint "+s.num}
  ],d=>{
    // Blank falls back to the plain number rather than an unlabelled sprint.
    s.name=(d.name||"").trim() || ("Sprint "+s.num);
    saveProject(p).then(render);
  });
}
/* Resize a task's daily points to a new day count, preserving progress.
   Trims from the end, or pads with the last known remaining value — a task
   sitting at 2 points stays at 2 rather than snapping back to its estimate. */
function refitPoints(t,n){
  const src=Array.isArray(t.points)?t.points:[];
  const last=src.length?src[src.length-1]:(t.est??1);
  t.points=Array.from({length:n},(_,i)=>src[i]!==undefined?src[i]:last);
  return t;
}
/* Move a whole user story to another sprint, refitting every task (including
   ones in inactive state) to the target sprint's day count. Sprint lengths
   differ — the 2-2-1-1-2-2 pattern means sprint 3 is half of sprint 1. */
function moveStoryToSprint(p,fromSp,st,toSid){
  const to=p.sprints.find(s=>s.id===toSid);
  if(!to||to.id===fromSp.id) return false;
  const n=daysOf(to).length;
  storySubs(st).flatMap(subTasks).forEach(t=>refitPoints(t,n));
  fromSp.stories=(fromSp.stories||[]).filter(x=>x.id!==st.id);
  if(!Array.isArray(to.stories)) to.stories=[];
  to.stories.push(st);
  return true;
}
/* One dialog serves both "+ User Story" and "edit" — same fields, same sticky
   behaviour, so creating a story offers the sprint picker and Active/Inactive
   just like editing one. Pass stid=null to create.
   Sticky: stays put until Save, Cancel or Esc. Backdrop clicks do nothing. */
function storyDialog(pid,sid,stid){
  const p=findProj(pid);
  const sp=p.sprints.find(s=>s.id===sid); if(!sp) return;
  const creating = !stid;
  const owner = p.student||state.currentUser;
  // No sub-story is created up front — the student adds one when they need it.
  // The board shows a "drop a task here or add a sub-story" hint in the gap,
  // and dropOnStoryBar auto-creates one if a task is dragged straight onto the
  // story bar, so an empty story is a perfectly workable state.
  const st = creating
    ? {id:uid(), title:"", lead:owner, manager:owner, active:true, subStories:[]}
    : (sp.stories||[]).find(s=>s.id===stid);
  if(!st) return;

  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="modal"><h3>${creating?"New User Story":"Edit User Story"}</h3><form id="es-form">
    <label>User story</label>
    <textarea id="es-title" rows="2" placeholder="As a player, I can …">${esc(st.title||"")}</textarea>
    <div style="display:flex;gap:8px">
      <div style="flex:1"><label>Lead</label><select id="es-lead">${rosterOptions(st.lead||"")}</select></div>
      <div style="flex:1"><label>Manager</label><select id="es-manager">${rosterOptions(st.manager||"")}</select></div>
    </div>
    <label>Sprint</label>
    <select id="es-sprint">${p.sprints.map(s=>`<option value="${s.id}" ${s.id===sp.id?"selected":""}>Sprint ${s.num}${s.name?" — "+esc(s.name):""} · ${daysOf(s).length} days</option>`).join("")}</select>
    <div class="sub" id="es-sprint-note" style="margin-top:5px"></div>
    <label>State</label>
    <select id="es-active">
      <option value="1" ${storyActive(st)?"selected":""}>Active — counted in totals and burndown</option>
      <option value="0" ${storyActive(st)?"":"selected"}>Inactive — greyed out, not counted</option>
    </select>
    <div class="actions">
      <button type="button" class="btn" id="es-cancel">Cancel</button>
      <button type="submit" class="btn primary">${creating?"Create":"Save"}</button>
    </div>
  </form></div>`;
  document.body.appendChild(ov);
  const $=s=>ov.querySelector(s);
  $("#es-title").focus();

  // Say what a sprint change is about to do before it happens.
  const note=$("#es-sprint-note"), selSprint=$("#es-sprint");
  const showNote=()=>{
    const to=p.sprints.find(s=>s.id===selSprint.value);
    if(!to||to.id===sp.id){ note.textContent=""; return; }
    if(creating){ note.textContent=`Will be created in Sprint ${to.num}, not this one.`; return; }
    const from=daysOf(sp).length, n=daysOf(to).length;
    note.textContent = n===from
      ? `Moves out of Sprint ${sp.num} into Sprint ${to.num}.`
      : `Moves to Sprint ${to.num} — daily cells refit from ${from} to ${n} days, keeping points remaining.`;
  };
  selSprint.onchange=showNote; showNote();

  const close=stickyDialog(ov,()=>ov.remove());
  $("#es-cancel").onclick=close;
  $("#es-form").onsubmit=e=>{
    e.preventDefault();
    const title=$("#es-title").value.trim();
    if(creating && !title){ alert("Give the user story a title."); return; }
    st.title=title;
    st.lead=$("#es-lead").value;
    st.manager=$("#es-manager").value;
    st.active=$("#es-active").value==="1";

    let moved=false;
    if(creating){
      const to=p.sprints.find(s=>s.id===selSprint.value)||sp;
      if(!Array.isArray(to.stories)) to.stories=[];
      to.stories.push(st);
      moved = to.id!==sp.id;
    } else {
      moved = moveStoryToSprint(p,sp,st,selSprint.value);
    }
    close();
    saveProject(p).then(()=>{
      render();
      if(moved){
        const to=p.sprints.find(s=>(s.stories||[]).some(x=>x.id===st.id));
        if(to) alert(creating
          ? `Created in Sprint ${to.num}, not the one you were viewing.`
          : `Moved to Sprint ${to.num}. It has left this sprint's board.`);
      }
    });
  };
}

/* "+ task" straight on the user story. Tasks still live inside a sub-story in
   the data model, so this quietly reuses the story's untitled holder — or
   creates one — instead of making the student build structure first. The
   holder shows its grey bar like any other, so you can name it later. */
function addTaskToStory(pid,sid,stid){
  const p=findProj(pid); if(!p) return;
  const sp=(p.sprints||[]).find(s=>s.id===sid); if(!sp) return;
  const st=(sp.stories||[]).find(s=>s.id===stid); if(!st) return;
  if(!Array.isArray(st.subStories)) st.subStories=[];

}
function addTask(pid,sid,stid,ssid){
  const p=findProj(pid);
  const sp=p.sprints.find(s=>s.id===sid);
  const st=sp.stories.find(s=>s.id===stid);

    {name:"cat",label:"Category",type:"select",options:CATS},

  ],d=>{if(!d.desc)return;

    ss.tasks.push({id:uid(),cat:d.cat,desc:d.desc,assignee:d.assignee,status:"Not Started",est,points:Array(n).fill(est),notes:"",images:[]});
    saveProject(p).then(render);});}

/* Assign a backlog task to a chosen Sprint → User Story → Sub-story. Moves the
   task object as-is (keeps notes/images/status), regenerating points for the
   target sprint's day count. */
function assignBacklog(pid,bid,defaultSid){
  const p=findProj(pid); if(!p)return;
  if(!p.sprints.length){ alert("Set up sprints first, then assign backlog items into them."); return; }
  const b=(p.backlog||[]).find(x=>x.id===bid); if(!b)return;
  const NEW="__new__";
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="modal"><h3>Assign to a sprint</h3>
    <div class="sub" style="margin:-8px 0 6px">“${esc(b.desc||"")}”</div>
    <label>Sprint</label><select id="asg-sprint"></select>
    <label>User story</label><select id="asg-story"></select>
    <label>Sub-story</label><select id="asg-sub"></select>
    <label>Estimate (points)</label><input id="asg-est" type="number" value="${b.est||1}">
    <div class="actions"><button type="button" class="btn" id="asg-cancel">Cancel</button><button type="button" class="btn primary" id="asg-ok">Assign</button></div>
  </div>`;
  document.body.appendChild(ov);
  const selS=ov.querySelector("#asg-sprint"), selST=ov.querySelector("#asg-story"), selSS=ov.querySelector("#asg-sub");
  const curSprint=()=>p.sprints.find(s=>s.id===selS.value);
  const curStory=()=>{ const sp=curSprint(); return selST.value===NEW?null:(sp.stories||[]).find(st=>st.id===selST.value); };
  function fillStories(){
    const sp=curSprint();
    const opts=(sp.stories||[]).map(st=>`<option value="${st.id}">${esc(st.title||"(untitled user story)")}</option>`);
    opts.push(`<option value="${NEW}">➕ New user story…</option>`);
    selST.innerHTML=opts.join("");
  }
  function fillSubs(){
    const st=curStory();
    const opts = st ? storySubs(st).map(ss=>`<option value="${ss.id}">${esc(ss.title||"(untitled sub-story)")}</option>`) : [];
    opts.push(`<option value="${NEW}">➕ New sub-story…</option>`);
    selSS.innerHTML=opts.join("");
  }
  selS.innerHTML=p.sprints.map(s=>`<option value="${s.id}" ${s.id===defaultSid?"selected":""}>Sprint ${s.num}${s.name?" — "+esc(s.name):""}</option>`).join("");
  fillStories(); fillSubs();
  selS.onchange=()=>{ fillStories(); fillSubs(); };
  selST.onchange=fillSubs;
  const close=stickyDialog(ov,()=>ov.remove());   // no backdrop dismissal
  ov.querySelector("#asg-cancel").onclick=close;
  ov.querySelector("#asg-ok").onclick=()=>{
    const sp=curSprint(); if(!sp)return;
    // resolve/create user story
    let st, newStory=null;
    if(selST.value===NEW){
      const t=prompt("New user story title:","As a team, we …"); if(t===null)return;
      newStory={id:uid(),title:(t||"").trim(),lead:p.student||state.currentUser,manager:p.student||state.currentUser,subStories:[]}; st=newStory;
    } else { st=(sp.stories||[]).find(x=>x.id===selST.value); if(!st)return; }
    // resolve/create sub-story
    let ss, newSub=null;
    if(selSS.value===NEW || !storySubs(st).length){
      const t=prompt("New sub-story title (optional):",""); if(t===null)return;
      newSub={id:uid(),title:(t||"").trim(),tasks:[]}; ss=newSub;
    } else { ss=storySubs(st).find(x=>x.id===selSS.value); if(!ss)return; }
    // commit — move the task object as-is, regenerating points for this sprint
    if(newStory) sp.stories.push(newStory);
    if(newSub){ if(!Array.isArray(st.subStories))st.subStories=[]; st.subStories.push(newSub); }
    const n=daysOf(sp).length, est=Math.max(0,parseInt(ov.querySelector("#asg-est").value)||1);
    b.est=est;
    b.points=Array(n).fill(est);
    ss.tasks.push(b);
    p.backlog=(p.backlog||[]).filter(x=>x.id!==bid);
    close();
    saveProject(p).then(render);
  };
}

/* ---------- small utils ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* Link chips are the one place a student's text lands in an href. esc() alone
   is not enough there: it stops the attribute being broken out of, but
   `javascript:alert(1)` contains no escapable character and would still run on
   click — for whoever opens that project, including the professor. Allow only
   http/https (and anchors), and fall back to a dead link rather than silently
   dropping the chip, so a mistyped URL is visible instead of mysterious. */
function safeUrl(u){
  const raw=String(u==null?"":u).trim();
  if(!raw) return "#";
  if(raw.startsWith("#")||raw.startsWith("/")) return esc(raw);
  let parsed;
  try{ parsed=new URL(raw,location.href); }
  catch(e){ return "#"; }                      // unparseable: dead link, not a hole
  return /^https?:$/.test(parsed.protocol) ? esc(parsed.href) : "#";
}

      <span class="row-x" style="opacity:1;position:absolute;top:-7px;right:-7px;background:var(--surface);border:1px solid var(--border2);border-radius:99px;width:16px;height:16px;line-height:15px;text-align:center;font-size:10px" title="Remove image" onclick="removeTaskImage('${t.id}','${im.id}')">✕</span>
    </div>`).join("")}

}
/* Cover = the first attached image; no per-task cover field to manage.

function taskCover(t){

/* Click-to-pick row. Values live in data-v; the pressed one carries the colour. */

    `<button type="button" class="opt-${o.replace(/ /g,'')}" data-v="${esc(o)}" aria-pressed="${o===current}">${esc(o)}</button>`
  ).join("")}</div>`;
