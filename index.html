function openTaskDetail(tid){
  const loc=locateTask(tid); if(!loc) return;
  const t=loc.t;
  const ov=document.createElement("div"); ov.className="overlay";
  // Snapshot for Cancel. Fields autosave as you go, so a Cancel that only
  // closed the window would be a lie — this restores the task as it was.
  const snapshot=JSON.parse(JSON.stringify(t));
  ov.innerHTML=`<div class="modal framed" style="width:640px;max-width:92vw;max-height:82vh">
    ${taskCover(t)}
    <div class="modal-scroll">
    <h3>Task detail</h3>
    <label>Description</label><input id="td-desc" value="${esc(t.desc)}">
    <div class="row" style="gap:14px;align-items:flex-start">
      <div><label>Category</label>${segRow("td-cat",CATS,t.cat)}</div>
      <div style="flex:1;min-width:150px"><label>Owner</label><select id="td-owner">${state.roster.map(r=>{const nm=fullName(r);return `<option ${nm===t.assignee?"selected":""}>${nm}</option>`;}).join("")}</select></div>
      <div style="width:90px"><label>Estimate</label><input id="td-est" type="number" value="${t.est}"></div>
    </div>
    <label>Status</label>${segRow("td-status",STATUSES,t.status)}
    <label>Notes</label><textarea id="td-notes" rows="5">${esc(t.notes||"")}</textarea>
    <label>Images</label>
    <div id="td-images">${renderImgStrip(t)}</div>
    <div class="row" style="gap:8px;margin-top:6px">
      <input id="td-img-url" placeholder="https://…" style="flex:1">
      <button type="button" class="btn small" id="td-img-add">Add URL</button>
    </div>
    ${modeHas("uploads") ? `
    <div class="row" style="gap:8px;margin-top:6px;align-items:center">
      <input id="td-img-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" style="flex:1">
      <button type="button" class="btn small" id="td-img-upload">Upload</button>
      <span class="sub" id="td-img-status"></span>
    </div>` : `
    <div class="sub" style="margin-top:6px">Uploading files needs the server build. Paste an image URL above instead.</div>`}
    <div class="sub" style="margin-top:10px;padding-bottom:14px">Images/links must follow SCAD guidelines.</div>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="td-cancel">Cancel</button>
      <button type="button" class="btn primary" id="td-close">Save</button>
    </div>
  </div>`;
  document.body.appendChild(ov);

  const save=(f,v)=>setTaskField(tid,f,v);
  // Repaint the cover in place — the modal must not be rebuilt mid-edit.
  const refreshCover=()=>{
    const l=locateTask(tid); if(!l) return;
    const host=ov.querySelector("#td-cover");
    if(host) host.outerHTML=taskCover(l.t);
  };
  // One click picks a value; the pressed chip carries the board's colour.
  const wireSeg=(id,field,after)=>{
    ov.querySelector("#"+id).addEventListener("click",e=>{
      const b=e.target.closest("button[data-v]"); if(!b) return;
      ov.querySelectorAll("#"+id+" button[data-v]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
      save(field,b.dataset.v);
      if(after) after();
    });
  };
  ov.querySelector("#td-desc").onchange=e=>save('desc',e.target.value);
  wireSeg("td-cat","cat",refreshCover);   // wordmark tracks the category
  wireSeg("td-status","status");
  ov.querySelector("#td-owner").onchange=e=>save('assignee',e.target.value);
  ov.querySelector("#td-est").onchange=e=>save('est',Math.max(0,parseInt(e.target.value)||0));
  ov.querySelector("#td-notes").onchange=e=>save('notes',e.target.value);
  ov.querySelector("#td-img-add").onclick=()=>{
    const inp=ov.querySelector("#td-img-url");
    const url=(inp.value||"").trim();
    if(!/^https:\/\//i.test(url)){ alert("Image URL must start with https://"); return; }
    const loc2=locateTask(tid); if(!loc2) return;
    if(!Array.isArray(loc2.t.images)) loc2.t.images=[];
    loc2.t.images.push({id:uid(), url, name:url.split('/').pop()||url});
    saveProject(loc2.p).then(render);
    ov.querySelector("#td-images").innerHTML=renderImgStrip(loc2.t);
    refreshCover();   // first image is the cover
    inp.value="";
  };
  // Absent in the local and cloud builds — the markup above renders a note in
  // its place, so this binding has nothing to attach to.
  if(ov.querySelector("#td-img-upload")) ov.querySelector("#td-img-upload").onclick=async()=>{
    const fileInp=ov.querySelector("#td-img-file");
    const file=fileInp.files&&fileInp.files[0];
    const statusEl=ov.querySelector("#td-img-status");
    if(!file){ alert("Choose an image file first."); return; }
    if(file.size>5*1024*1024){ alert("Image exceeds the 5MB limit."); return; }
    statusEl.textContent="Uploading…";
    const fd=new FormData(); fd.append("file",file);
    try{
      const res=await apiFetch("api.php?action=upload_image&project="+encodeURIComponent(loc.p.id),{method:"POST",body:fd});
      const data=await res.json();
      statusEl.textContent="";
      if(!data||!data.success){ alert((data&&data.error)||"Upload failed."); return; }
      const loc2=locateTask(tid); if(!loc2) return;
      if(!Array.isArray(loc2.t.images)) loc2.t.images=[];
      loc2.t.images.push({id:uid(), url:data.url, name:data.name||file.name});
      saveProject(loc2.p).then(render);
      ov.querySelector("#td-images").innerHTML=renderImgStrip(loc2.t);
      refreshCover();   // first image is the cover
      fileInp.value="";
    }catch(e){
      statusEl.textContent="";
      alert("Upload failed.");
    }
  };
  const close=stickyDialog(ov,()=>ov.remove());   // no backdrop dismissal
  ov.querySelector("#td-close").onclick=close;    // Save — everything is already written
  ov.querySelector("#td-cancel").onclick=()=>{
    const l=locateTask(tid);
    if(l){
      // Put every field back the way it was on open. Any file uploaded during
      // the session stays on the server but is dropped from the task.
      const keep=l.t;
      Object.keys(keep).forEach(k=>{ if(!(k in snapshot)) delete keep[k]; });
      Object.assign(keep,JSON.parse(JSON.stringify(snapshot)));
      saveProject(l.p).then(render);
    }
    close();
  };
}
function removeTaskImage(tid,imgid){
  const loc=locateTask(tid); if(!loc) return;
  loc.t.images=(loc.t.images||[]).filter(x=>x.id!==imgid);
  saveProject(loc.p).then(render);
  const ov=document.querySelector(".overlay");
  if(ov){
    ov.querySelector("#td-images").innerHTML=renderImgStrip(loc.t);
    // deleting the first image promotes the next one to cover
    const host=ov.querySelector("#td-cover");
    if(host) host.outerHTML=taskCover(loc.t);
  }
}

        <button class="btn small" onclick="setRolePass('test')">Change</button>
      </div>` : `

        <div><b>${BACKEND_MODE==="local" ? "This computer only" : "Shared, no passphrase"}</b>

            ? `Nothing here is shared and nothing leaves this browser. Export below is your only copy —
               browser storage is tied to this exact file location and is lost if the file moves.`
            : `Everyone in the class shares this data, and so can anyone with the link.
               Private notes are switched off in this build for that reason.`}</div></div>
      </div>`}
      <div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--border)">
        <div><b>Sample data</b><div class="sub">Load the 3 demo projects for testing.</div></div>

        <div><b>Backups</b><div class="sub">Daily snapshots + manual backup &amp; restore.</div></div>
        <button class="btn small" onclick="showBackupsModal()">Open backups</button>
      </div>` : ``}
      <div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--border)">
        <div><b>Export class JSON</b><div class="sub">${modeHas("backups")
          ? "A copy of the whole class in one file, saved to your Downloads."
          : "This build has no automatic backups. Do this at the end of every class."}</div></div>
        <button class="btn small" onclick="exportClassJSON()">Export</button>
      </div>
      <div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--border)">
        <div><b>Import class JSON</b><div class="sub">Replaces everything currently here with the contents of an exported file.</div></div>
        <button class="btn small" onclick="importClassJSON()">Import</button>
      </div>

/* =========================================================
   EXPORT / IMPORT — the class as one file.

   In the server build this is a convenience next to the daily zips. In the
   local and cloud builds it is the ONLY backup that exists, which is why the
   Manage page says so in those modes rather than leaving it as a quiet button.

   The file is deliberately plain: roster, projects, settings, exactly as the
   app holds them. No wrapper format to go stale, and readable in any text
   editor if it ever has to be repaired by hand.
   ========================================================= */
function exportClassJSON(){
  const payload = {
    app: "GAME 405 Sprint Dashboard",
    version: APP_VERSION,
    mode: BACKEND_MODE,
    exportedAt: new Date().toISOString(),
    roster: state.roster,
    settings: state.settings || {},
    projects: state.projects
  };
  const stamp = new Date().toISOString().slice(0,10);
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = `game405-class-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // Revoking immediately can cancel the download in Safari; one tick is enough.
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function importClassJSON(){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json,.json";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    let data;
    try {
      data = JSON.parse(await f.text());
    } catch (e) {
      alert("That file is not readable JSON.");
      return;
    }
    if (!data || !Array.isArray(data.projects) || !Array.isArray(data.roster)) {
      alert("That does not look like a class export.\n\nExpected a file with a roster and projects, from Manage → Export.");
      return;
    }
    const n = data.projects.length, r = data.roster.length;
    if (!confirm(`Replace everything currently here with this file?\n\n` +
                 `Importing: ${r} student${r===1?"":"s"}, ${n} project${n===1?"":"s"}` +
                 (data.exportedAt ? `\nExported: ${data.exportedAt.slice(0,10)}` : ``) +
                 `\n\nCurrently here: ${state.roster.length} students, ${state.projects.length} projects.` +
                 `\n\nThis cannot be undone.`)) return;

    // Order matters: roster first so projects have owners to point at, and the
    // removals last so a failure part-way leaves data present, not missing.
    state.roster = migrateRoster(data.roster);
    if (!await saveRoster()) { alert("Import stopped: the roster could not be saved."); return; }

    state.settings = data.settings || {};
    await saveSettings();

    const keep = new Set();
    for (const p of data.projects) {
      normalizeProject(p);
      keep.add(p.id);
      await saveProject(p);
    }
    for (const p of state.projects.slice()) {
      if (!keep.has(p.id)) {
        await apiFetch("api.php?action=delete_project&id=" + encodeURIComponent(p.id), { method: "POST" });
      }
    }

    await loadState();
    render();
    alert(`Imported ${r} student${r===1?"":"s"} and ${n} project${n===1?"":"s"}.`);
  };
  inp.click();
}

/* =========================================================
   PORTRAIT CROPPER

   Portraits render in a square frame, so an uncropped upload gets
   centre-cropped by object-fit and heads land off-centre. This lets you pick
   the framing before it is sent.

   It also removes an entire class of upload bug: the output is always a
   canvas-encoded JPEG at a fixed size, so what arrives at the server can never
   be a PNG wearing a .jpg extension, never be a 40MP camera file, and never
   carry EXIF orientation the server has to reason about.

   Vanilla canvas, no library — same constraint as the rest of the app.
   ========================================================= */
const PORTRAIT_OUT = 512;    // stored size, px square
const CROP_VIEW    = 300;    // on-screen crop viewport, px square

function openPortraitCropper(file,onDone){
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onerror=()=>{ URL.revokeObjectURL(url); alert("That file could not be read as an image."); };
  img.onload=()=>{
    const ov=document.createElement("div"); ov.className="overlay";
    ov.innerHTML=`<div class="modal" style="width:auto">
      <h3>Choose the framing</h3>
      <div class="sub" style="margin:-4px 0 10px">Drag to move · scroll or use the slider to zoom</div>
      <div id="crop-stage" style="width:${CROP_VIEW}px;height:${CROP_VIEW}px;position:relative;
        overflow:hidden;border:1px solid var(--border2);background:var(--gray-bg);
        cursor:grab;touch-action:none;margin:0 auto"></div>
      <div class="row" style="margin-top:12px;gap:10px;align-items:center">
        <span class="muted" style="font-size:11px">zoom</span>
        <input id="crop-zoom" type="range" min="100" max="400" value="100" style="flex:1">
      </div>
      <div class="actions">
        <button type="button" class="btn" id="crop-cancel">Cancel</button>
        <button type="button" class="btn primary" id="crop-ok">Use this photo</button>
      </div>
    </div>`;
    document.body.appendChild(ov);

    const stage=ov.querySelector("#crop-stage");
    stage.appendChild(img);
    img.style.position="absolute";
    img.style.transformOrigin="0 0";
    img.style.userSelect="none";
    img.draggable=false;

    // "cover" baseline: the smaller dimension exactly fills the viewport, so
    // there is never a gap to leave uncovered at zoom 1.
    const base=CROP_VIEW/Math.min(img.naturalWidth,img.naturalHeight);
    let zoom=1, ox=0, oy=0;

    function clamp(){
      const w=img.naturalWidth*base*zoom, h=img.naturalHeight*base*zoom;
      ox=Math.min(0,Math.max(CROP_VIEW-w,ox));
      oy=Math.min(0,Math.max(CROP_VIEW-h,oy));
    }
    function paint(){
      clamp();
      img.style.width=(img.naturalWidth*base*zoom)+"px";
      img.style.height="auto";
      img.style.left=ox+"px"; img.style.top=oy+"px";
    }
    // start centred
    function centre(){
      ox=(CROP_VIEW-img.naturalWidth*base*zoom)/2;
      oy=(CROP_VIEW-img.naturalHeight*base*zoom)/2;
      paint();
    }
    centre();

    let dragging=false,px=0,py=0;
    stage.addEventListener("pointerdown",e=>{
      dragging=true; px=e.clientX; py=e.clientY;
      stage.setPointerCapture(e.pointerId); stage.style.cursor="grabbing";
    });
    stage.addEventListener("pointermove",e=>{
      if(!dragging) return;
      ox+=e.clientX-px; oy+=e.clientY-py; px=e.clientX; py=e.clientY; paint();
    });
    const endDrag=()=>{ dragging=false; stage.style.cursor="grab"; };
    stage.addEventListener("pointerup",endDrag);
    stage.addEventListener("pointercancel",endDrag);

    const slider=ov.querySelector("#crop-zoom");
    function setZoom(z,anchorX,anchorY){
      const prev=zoom;
      zoom=Math.max(1,Math.min(4,z));
      // keep the point under the cursor (or the centre) fixed while scaling
      const ax=anchorX===undefined?CROP_VIEW/2:anchorX;
      const ay=anchorY===undefined?CROP_VIEW/2:anchorY;
      ox=ax-((ax-ox)*(zoom/prev));
      oy=ay-((ay-oy)*(zoom/prev));
      paint();
      if(slider.value!=String(Math.round(zoom*100))) slider.value=Math.round(zoom*100);
    }
    slider.oninput=()=>setZoom(parseInt(slider.value,10)/100);
    stage.addEventListener("wheel",e=>{
      e.preventDefault();
      const rect=stage.getBoundingClientRect();
      setZoom(zoom*(e.deltaY<0?1.12:1/1.12), e.clientX-rect.left, e.clientY-rect.top);
    },{passive:false});

    const close=stickyDialog(ov,()=>{ URL.revokeObjectURL(url); ov.remove(); });
    ov.querySelector("#crop-cancel").onclick=close;
    ov.querySelector("#crop-ok").onclick=()=>{
      const c=document.createElement("canvas");
      c.width=PORTRAIT_OUT; c.height=PORTRAIT_OUT;
      const g=c.getContext("2d");
      g.fillStyle="#fff"; g.fillRect(0,0,PORTRAIT_OUT,PORTRAIT_OUT);   // JPEG has no alpha
      const k=PORTRAIT_OUT/CROP_VIEW;            // viewport px -> output px
      g.drawImage(img, ox*k, oy*k,
        img.naturalWidth*base*zoom*k, img.naturalHeight*base*zoom*k);
      c.toBlob(blob=>{
        close();
        if(!blob){ alert("Could not process that image."); return; }
        onDone(new File([blob],"portrait.jpg",{type:"image/jpeg"}));
      },"image/jpeg",0.9);
    };
  };
  img.src=url;
}

/* =========================================================
   DATA-EXPOSURE SELF-CHECK  (manager sessions only)

   data/ is protected by exactly one thing: a `Deny from all` .htaccess. That
   is a single point of failure with no second layer — if the file goes missing
   in a botched upload, or the host stops honouring .htaccess, then
   data/manager.pass and the whole roster are served to anyone who asks, and
   nothing anywhere would tell you.

   So don't assume: ask. The browser can fetch our own data/ path same-origin,
   and a 200 means the deny rule is not working. Runs once per manager session.
   ========================================================= */
async function checkDataExposure(){
  if(state.role!=="manager" || sessionStorage.getItem("g405_exposecheck")) return;
  sessionStorage.setItem("g405_exposecheck","1");
  try{
    const res=await fetch("data/roster.json",{credentials:"same-origin",cache:"no-store"});
    if(res.status===200){
      const body=await res.text();
      // A real roster file, not a friendly 404 page dressed as a 200.
      if(body.indexOf("first")>=0 || body.indexOf("[")===0){
        showExposureBanner();
      }
    }
  }catch(e){ /* blocked or offline — that is the good outcome */ }
}
function showExposureBanner(){
  if(document.getElementById("expose-banner")) return;
  const d=document.createElement("div");
  d.id="expose-banner";
  d.style.cssText="position:sticky;top:0;z-index:60;background:#c62828;color:#fff;padding:10px 16px;"
    +"font-size:13px;line-height:1.5;display:flex;gap:14px;align-items:center;justify-content:space-between";
  d.innerHTML=`<div><b>Your data folder is publicly readable.</b>
    <code>data/roster.json</code> just loaded over plain HTTP — which means
    <code>data/manager.pass</code> and every student's name are open to anyone with the URL.
    The <code>.htaccess</code> deny rule in <code>data/</code> is missing or not being honoured.</div>
    <button class="btn small" style="flex:none" onclick="this.parentNode.remove()">Dismiss</button>`;
  document.body.insertBefore(d,document.body.firstChild);
}

/* ---------- roster photos (manager only) ----------
   Uploaded to uploads/_roster/ via its own manager-gated endpoint, then
   recorded on the roster entry. Two writes, and the second can fail — so the
   local edit is rolled back if saveRoster() says no, rather than leaving the
   UI showing a photo the server never accepted. */
async function setRosterPhoto(rid){
  const r=state.roster.find(x=>x.id===rid);
  if(!r){ alert("That student is no longer on the roster."); return; }
  if(!modeHas("uploads")){
    // No cropper here — it re-encodes a File, and there is no file. The image
    // is CSS-cropped to the frame like every other portrait.
    const img=promptImageUrl("this student's photo"); if(!img) return;
    const before=r.photo;
    r.photo={url:img.url,name:img.name||"portrait.jpg"};
    if(!(await saveRoster())){ r.photo=before; alert("The roster could not be saved."); }
    render();
    return;
  }
  pickImage(file=>openPortraitCropper(file, async cropped=>{
    try{
      const fd=new FormData(); fd.append("file",cropped);
      const res=await apiFetch("api.php?action=upload_roster_photo&roster="+encodeURIComponent(rid),
        {method:"POST",body:fd});
      const d=await res.json().catch(()=>({}));
      // Surface the server's own message. "Upload failed" taught us nothing
      // when this broke on the server; "uploads/_roster is not writable" does.
      if(!res.ok||!d.url){ alert(d.error||`Upload failed (HTTP ${res.status}).`); return; }
      const before=r.photo;
      r.photo={url:d.url,name:d.name||"portrait.jpg"};
      if(!(await saveRoster())){ r.photo=before; alert("The photo uploaded but the roster could not be saved."); }
      render();
    }catch(e){ alert("Could not upload the photo: "+e.message); }
  }), "image/*");
}
async function clearRosterPhoto(rid){
  const r=state.roster.find(x=>x.id===rid); if(!r||!r.photo) return;
  const before=r.photo;
  r.photo=null;
  if(!(await saveRoster())){ r.photo=before; }
  render();
}

/* ---------- test-account sandbox ----------
   Projects written by the test role are stamped test:true by the SERVER, so
   the flag survives regardless of what the client does. This is only the view
   filter for them. */
function testProjects(){ return (state.projects||[]).filter(p=>p&&p.test); }
function visibleProjects(){
  return (showTestProjects || state.role==="test")
    ? (state.projects||[])
    : (state.projects||[]).filter(p=>!(p&&p.test));
}
function toggleTestProjects(){
  showTestProjects=!showTestProjects;
  localStorage.setItem("g405_show_test", showTestProjects?"1":"0");
  render();
}
/* =========================================================
   SIGN IN / SIGN OUT / VIEW AS

   One passphrase field for all three roles: the server decides which one you
   gave it and answers with a role. Students never see a role picker, and a
   wrong guess cannot be narrowed down by which field it was typed into.
   ========================================================= */

/* The lock screen. Rendered into #app like any other view, but it deliberately
   blanks the crumbs and the identity dropdown too — those are built from the
   roster, and the roster is exactly what an unauthenticated visitor must not
   see. */
function renderLock(){
  const crumbs=document.getElementById("crumbs"); if(crumbs) crumbs.innerHTML="";
  const who=document.getElementById("whoami"); if(who) who.innerHTML="";
  const bar=document.querySelector(".whoami"); if(bar) bar.style.display="none";
  ["btn-manage","btn-lock"].forEach(id=>{const b=document.getElementById(id); if(b) b.style.display="none";});
  const host=cardHostEl(); if(host) host.innerHTML="";

  const app=document.getElementById("app");
  if(!state.configured){
    app.innerHTML=`<div class="panel" style="max-width:520px;margin:60px auto"><div class="p-body" style="padding:26px">
      <h1 style="margin-bottom:6px">Setup required</h1>
      <div class="sub" style="line-height:1.6">This class has no passphrases yet, so the app is closed to everyone.
      Upload <code>setpass.php</code>, open it once in a browser to set the student and manager
      passphrases, then delete it.</div>
    </div></div>`;
    return;
  }
  app.innerHTML=`<div class="panel" style="max-width:420px;margin:60px auto"><div class="p-body" style="padding:26px">
    <h1 style="margin-bottom:6px">GAME 405 Sprint Dashboard</h1>
    <div class="sub" style="margin-bottom:18px">Enter the class passphrase to continue.</div>
    <input id="lock-pass" type="password" placeholder="Passphrase" autocomplete="current-password"
      style="width:100%;font:inherit;padding:9px 11px;border:1px solid var(--border2);border-radius:6px;box-sizing:border-box"
      onkeydown="if(event.key==='Enter')signIn()">
    <div id="lock-err" class="sub" style="color:var(--red);min-height:18px;margin-top:8px"></div>
    <div class="row" style="justify-content:flex-end;margin-top:6px">
      <button class="btn primary" onclick="signIn()">Sign in</button>
    </div>
  </div></div>`;
  const el=document.getElementById("lock-pass"); if(el) el.focus();
}

async function signIn(){
  const input=document.getElementById("lock-pass");
  const err=document.getElementById("lock-err");
  const pass=input?input.value:"";
  if(!pass){ if(err) err.textContent="Enter the passphrase."; return; }
  if(err) err.textContent="Checking…";
  try{
    // Not apiFetch: a failed sign-in returns 401 by design, and routing that
    // through the signed-out handler would re-render the screen mid-typing.
    const res=await fetch("api.php?action=login",{method:"POST",credentials:"same-origin",
      headers:jsonHeaders(),body:JSON.stringify({pass})});
    const d=await res.json().catch(()=>({}));
    if(!res.ok){
      if(err) err.textContent=d.error||"Incorrect passphrase.";
      if(d.error==="setup_required"){ state.configured=false; renderLock(); }
      if(input){ input.value=""; input.focus(); }
      return;
    }
    lockedOut=false;
    state.role=d.role; state.trueRole=d.trueRole||d.role;
    state.configured=true;
    const bar=document.querySelector(".whoami"); if(bar) bar.style.display="";
    if(await loadState()){ render(); startPolling(); checkDataExposure(); }
  }catch(e){ if(err) err.textContent="Could not reach the server."; }
}

async function signOut(){
  await flushNoteSave();
  try{ await fetch("api.php?action=logout",{method:"POST",credentials:"same-origin"}); }catch(e){}
  lockedOut=false;               // so handleSignedOut() actually runs
  handleSignedOut(false);
}

/* Switch the SERVER-side role down to student/test and back. A real downgrade,
   not a UI costume: while viewing as a student you hit the same 403s a student
   hits, which is the only way testing the gate table means anything. */
async function viewAs(role){
  await flushNoteSave();
  try{
    const res=await apiFetch("api.php?action=view_as",{method:"POST",headers:jsonHeaders(),
      body:JSON.stringify({role})});
    if(!res.ok){ alert("Could not switch role."); return; }
    const d=await res.json();
    state.role=d.role; state.trueRole=d.trueRole;
    // Notes are manager-only; drop them when stepping down so they are not
    // sitting in memory while the app is pretending to be a student.
    cardState.notes={}; cardState.notesLoaded=false;
    closeStudentCard();
    await loadState();
    nav("#/"); render();
  }catch(e){ alert("Could not switch role."); }
}

function inManageMode(){ return state.role==="manager"; }

/* Topbar chrome. The role badge is always visible — with a View As switch in
   the app it is genuinely easy to forget which role you are in and conclude a
   button is broken when it is only correctly denied. */
function syncManageChrome(){
  if(lockedOut) return;
  const manage=document.getElementById("btn-manage");
  const l=document.getElementById("btn-lock");
  const badge=document.getElementById("role-badge");

  /* No session, no roles, nothing to sign out of: local and cloud builds drop
     the whole auth chrome rather than show controls that lead nowhere. */
  if(!modeHas("auth")){
    if(badge) badge.style.display="none";
    if(l) l.style.display="none";
    if(manage){
      manage.style.display="inline-flex";
      manage.style.opacity="";
      manage.title="Roster, class settings, import/export";
    }
    return;
  }

  if(badge){
    const viewing = state.trueRole==="manager" && state.role!=="manager";
    badge.style.display = state.role==="none" ? "none" : "inline-flex";
    badge.textContent = viewing ? `viewing as ${state.role} ▸ back` : state.role;
    badge.title = viewing
      ? "You are a manager viewing the app as another role. Click to return to manager."
      : `Signed in as ${state.role}`;
    badge.onclick = viewing ? ()=>viewAs("manager") : null;
    badge.style.cursor = viewing ? "pointer" : "default";
    badge.style.background = viewing ? "var(--amber-bg)" : "";
    badge.style.borderColor = viewing ? "var(--amber)" : "";
    badge.style.color = viewing ? "#7c4a03" : "";
  }
  /* Manage stays visible for ANY signed-in role, the way it was before v1.0.0.
     Hiding it from students was a mistake: it removed the only route back to
     manager mode, so the professor signing in on a student's machine had no
     visible way in. The button is not the gate — renderManage() checks the
     role and shows a "manager only" panel with a way forward, and every
     endpoint behind it 403s regardless. Discoverability and enforcement are
     different jobs; only the server does the second one. */
  if(manage){
    manage.style.display = state.role==="none" ? "none" : "inline-flex";
    manage.style.opacity = state.role==="manager" ? "" : ".55";
    manage.title = state.role==="manager"
      ? "Roster, class settings, backups, private notes"
      : "Manager only — sign in with the manager passphrase";
  }
  if(l){
    l.style.display = state.role==="none" ? "none" : "inline-flex";
    l.textContent = "Sign out";
    l.title = "End this session on this browser";
    l.onclick = signOut;
  }
}

function enterManageMode(){ nav("#/manage"); render(); }
/* ---------- roster sorting ----------
   This REORDERS AND SAVES the roster, it does not just re-sort the view. That
   is deliberate: roster order is what drives every Owner / Lead / Manager
   dropdown in the app, so a view-only sort would leave those unsorted — which
   is the thing that actually hurts with 15 names. The ↑/↓ buttons still work
   afterwards for hand-placing anyone (e.g. putting yourself back on top). */
let rosterSort = { key:null, dir:1 };
function sortArrow(key){
  if(rosterSort.key!==key) return '<span style="opacity:.35">↕</span>';
  return rosterSort.dir===1 ? '▲' : '▼';
}
async function sortRoster(key){
  rosterSort = (rosterSort.key===key) ? {key, dir:-rosterSort.dir} : {key, dir:1};
  const d=rosterSort.dir;
  const cmp=(a,b)=>String(a||"").localeCompare(String(b||""),undefined,{sensitivity:"base",numeric:true});
  const before=state.roster.slice();
  state.roster.sort((a,b)=>{
    // tie-break on the other name so "Rivera" and "Rivera Santos" sort stably
    const primary = key==="first" ? cmp(a.first,b.first) : cmp(a.last,b.last);
    if(primary) return primary*d;
    const secondary = key==="first" ? cmp(a.last,b.last) : cmp(a.first,b.first);
    return secondary*d;
  });
  if(!(await saveRoster())){ state.roster=before; }   // manager gate said no
  render();
}
function addStudent(){
  openForm("Add Student",[
    {name:"first",label:"First name"},
    {name:"last",label:"Last name"},
    {name:"type",label:"Project track",type:"select",options:TYPES.map(t=>t[0])},
    {name:"title",label:"Project title (optional)",ph:"student can rename later"}
  ],async d=>{
    if(!d.first&&!d.last)return;
    const entry={id:uid(),first:d.first,last:d.last};
    const nm=fullName(entry);
    if(state.roster.some(r=>fullName(r).toLowerCase()===nm.toLowerCase())){ if(!confirm("A student with that name already exists. Add anyway?"))return; }
    state.roster.push(entry);
    if(!(await saveRoster())){ state.roster.pop(); return; }
    // auto-create project shell
    const p=newProjectShell(nm, d.title||(d.first? d.first+"’s Project":"Untitled Project"), d.type);
    await saveProject(p);
    render();
  });
}
/* =========================================================
   STUDENT CARD PANEL  (Manage Class → roster “edit”)

   One markup, two containers: `.dock` sits in the flex row beside #app so the
   board shrinks rather than being covered; `.pop` promotes the same node to a
   centred modal for more room.

   Deliberate behaviours:
   - Stays open until Done or Esc. Outside-click does nothing, so a stray click
     can't discard a half-typed note.
   - Autosaves per field on blur (text) or immediately (images, notes debounced).
     There is no revert — image uploads already hit the server, so a Cancel that
     un-did text but not images would be a lie.
   - Lives OUTSIDE #app, so render() rebuilding the board can't destroy it.
   - Notes are the one manager-only thing in the app; they go to a separate
     gated endpoint and never enter get_state.
   ========================================================= */
const cardState = { rosterId:null, mode:"dock", notes:{}, notesLoaded:false, notesGated:false, saveTimer:null };

function cardHostEl(){ return document.getElementById("cardHost"); }
function cardRoster(){ return state.roster.find(x=>x.id===cardState.rosterId) || null; }
function cardProject(r){ return r ? (state.projects.find(p=>p.student===fullName(r)) || null) : null; }

/* ---------- private notes transport (manager-gated) ---------- */
async function fetchNotes(){
  // Builds without a passphrase have no notes to fetch and no place to keep
  // them. Return "loaded but empty" so the card renders instead of spinning.
  if(!modeHas("notes")){ cardState.notes={}; cardState.notesGated=true; cardState.notesLoaded=true; return; }
  try{
    const res = await apiFetch("api.php?action=get_notes",{headers:jsonHeaders()});
    if(res.status===403){ cardState.notes={}; cardState.notesGated=true; cardState.notesLoaded=true; return; }
    const d = await res.json();
    const n = d && d.notes;
    cardState.notes = (n && typeof n==="object" && !Array.isArray(n)) ? n : {};
    cardState.notesGated = !!(d && d.gated);
  }catch(e){ console.error("Could not load private notes:",e); }
  cardState.notesLoaded = true;
}
async function pushNotes(){
  try{
    const res = await apiFetch("api.php?action=save_notes",{method:"POST",headers:jsonHeaders(),body:JSON.stringify(cardState.notes)});
    return res.ok;
  }catch(e){ return false; }
}
function noteStatus(msg){ const el=document.getElementById("sc-saved"); if(el) el.textContent=msg; }
function queueNoteSave(){
  clearTimeout(cardState.saveTimer);
  noteStatus("saving…");
  cardState.saveTimer = setTimeout(async ()=>{
    cardState.saveTimer=null;
    noteStatus(await pushNotes() ? "notes saved" : "NOT saved — passphrase?");
  },600);
}
async function flushNoteSave(){
  if(!cardState.saveTimer) return;
  clearTimeout(cardState.saveTimer); cardState.saveTimer=null;
  await pushNotes();
}

/* ---------- image slots (reuses the task-image endpoint) ---------- */
function pickImage(cb,accept){
  const inp=document.createElement("input");
  // Portraits pass "image/*": they are re-encoded to JPEG by the cropper before
  // upload, so anything the browser can decode is fair game — including the
  // HEIC that comes straight off a phone, which the narrow list silently
  // greys out in the file picker with no explanation.
  inp.type="file"; inp.accept=accept||"image/png,image/jpeg,image/gif,image/webp";
  inp.onchange=()=>{ if(inp.files&&inp.files[0]) cb(inp.files[0]); };
  inp.click();
}
async function setCardImage(slot){
  const p=cardProject(cardRoster());
  if(!p){ alert("This student has no project yet — create one first."); return; }
  if(!modeHas("uploads")){
    const img=promptImageUrl(slot==="portrait"?"the project portrait":"the project banner");
    if(!img) return;
    const cur=state.projects.find(x=>x.id===p.id)||p;
    cur[slot]=img;
    await saveProject(cur);
    renderStudentCard();
    return;
  }
  pickImage(async file=>{
    noteStatus("uploading "+slot+"…");
    try{
      const fd=new FormData(); fd.append("file",file);
      const res=await apiFetch("api.php?action=upload_image&project="+encodeURIComponent(p.id),{method:"POST",body:fd});
      const d=await res.json();
      if(!res.ok||!d.url){ alert(d.error||"Upload failed."); noteStatus(""); return; }
      const cur=state.projects.find(x=>x.id===p.id)||p;
      cur[slot]={url:d.url,name:d.name||file.name};
      await saveProject(cur);
      noteStatus("");
      renderStudentCard();
    }catch(e){ alert("Upload failed."); noteStatus(""); }
  });
}
async function clearCardImage(slot){
  const p=cardProject(cardRoster()); if(!p) return;
  if(!confirm("Remove this image?")) return;
  const cur=state.projects.find(x=>x.id===p.id)||p;
  cur[slot]=null;
  await saveProject(cur);
  renderStudentCard();
}

/* ---------- open / close / pop ---------- */
function cardKeydown(e){
  // Esc closes. Safe because everything is already saved — but flush first.
  if(e.key==="Escape" && !document.querySelector(".overlay")) closeStudentCard();
}
async function openStudentCard(id){
  const r=state.roster.find(x=>x.id===id); if(!r) return;
  cardState.rosterId=id;
  document.addEventListener("keydown",cardKeydown);
  renderStudentCard();
  if(!cardState.notesLoaded){ await fetchNotes(); renderStudentCard(); }
}
function closeStudentCard(){
  flushNoteSave();
  document.removeEventListener("keydown",cardKeydown);
  cardState.rosterId=null;
  const h=cardHostEl(); if(h) h.innerHTML="";
  document.querySelectorAll(".scard-scrim").forEach(n=>n.remove());
}
function toggleCardPop(){
  cardState.mode = cardState.mode==="pop" ? "dock" : "pop";
  renderStudentCard();
}
// Back-compat: the roster table still calls editStudent().
function editStudent(id){ openStudentCard(id); }

/* ---------- read-only progress readout ---------- */
function cardProgressHTML(p){
  if(!p) return `<div class="scard-prog"><span class="muted">No project yet.</span></div>`;
  const sprints=p.sprints||[];
  if(!sprints.length) return `<div class="scard-prog"><span class="muted">No sprints set up yet.</span></div>`;
  const cur=currentSprint(p);
  const chips=sprints.map(s=>{
    const cls = s===cur ? "now" : (s.end<todayISO ? "done" : "");
    return `<div class="scard-chip ${cls}" title="Sprint ${s.num} · ${fmt(s.start)}–${fmt(s.end)}"></div>`;
  }).join("");
  const tasks=cur?sprintTasks(cur):[];
  const done=tasks.filter(t=>t.status==="Approved"||t.status==="Completed").length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  return `<div class="scard-prog">
    <div class="scard-chips">${chips}</div>
    <div class="scard-stat">
      <span><b>${cur?"Sprint "+cur.num:"—"}</b> · ${tasks.length?`${done}/${tasks.length} tasks · ${pct}%`:"no tasks"}</span>
      <span>${timeAgo(p.updatedAt)}</span>
    </div>
    <canvas class="scard-spark" id="sc-spark"></canvas>
  </div>`;
}
function drawCardSpark(){
  const cv=document.getElementById("sc-spark"); if(!cv) return;
  const p=cardProject(cardRoster()); if(!p||!(p.sprints||[]).length) return;
  const sp=currentSprint(p); if(!sp) return;
  drawBurn(cv,sp);
}
// Called at the end of render(): refresh only the derived block, never the
// inputs — the professor may be mid-word in one of them.
function refreshStudentCard(){
  if(!cardState.rosterId) return;
  // The card is a Manage Class tool; navigating away closes it.
  if(!location.hash.replace(/^#\/?/,"").startsWith("manage")){ closeStudentCard(); return; }
  const r=cardRoster();
  if(!r){ closeStudentCard(); return; }   // student was removed underneath us
  const box=document.getElementById("sc-prog"); if(!box) return;
  box.innerHTML=cardProgressHTML(cardProject(r));
  drawCardSpark();
}

/* Identity is a full-name STRING everywhere — p.student, st.lead, st.manager
   and every t.assignee. Renaming has to rewrite all four or the stale ones stop
   matching any <option>, and the select silently falls back to the first person
   in the roster — quietly reassigning that task to the wrong student. */
async function repointIdentity(oldNm,newNm){
  if(!oldNm||oldNm===newNm) return;
  for(const p of state.projects){
    let touched=false;
    if(p.student===oldNm){ p.student=newNm; touched=true; }
    for(const sp of p.sprints||[]) for(const st of sp.stories||[]){
      if(st.lead===oldNm){ st.lead=newNm; touched=true; }
      if(st.manager===oldNm){ st.manager=newNm; touched=true; }
      for(const ss of storySubs(st)) for(const t of subTasks(ss)){
        if(t.assignee===oldNm){ t.assignee=newNm; touched=true; }
      }
    }
    for(const b of p.backlog||[]) if(b.assignee===oldNm){ b.assignee=newNm; touched=true; }
    if(touched) await saveProject(p);
  }
  if(state.currentUser===oldNm){
    state.currentUser=newNm;
    localStorage.setItem("g405_user",newNm);
  }
}

/* ---------- name commit ---------- */
async function commitCardName(field,value){
  const r=cardRoster(); if(!r) return;
  const prev=r[field];
  const oldNm=fullName(r);
  r[field]=(value||"").trim();
  const newNm=fullName(r);
  if(newNm===oldNm) return;
  if(!newNm){ r[field]=prev; renderStudentCard(); alert("A student needs at least one name."); return; }
  if(!(await saveRoster())){ r[field]=prev; renderStudentCard(); return; }
  await repointIdentity(oldNm,newNm);
  render();
}

/* ---------- the panel ---------- */

  const host=cardHostEl(); if(!host) return;

  document.querySelectorAll(".scard-scrim").forEach(n=>n.remove());
  if(pop){
    const s=document.createElement("div"); s.className="scard-scrim";
    document.body.appendChild(s); // no click handler — outside-click must not close
  }

  const banner = p&&p.banner
    ? `<img src="${esc(p.banner.url)}" alt=""><span class="swap">replace ▾</span>`
    : `<div class="ph">${p?"Click to add a project banner":"No project yet"}</div>`;
  /* The portrait slot now reads the ROSTER photo, not p.portrait. The old
     project-level field is still honoured as a fallback so existing data

  const portraitUrl = (r.photo && r.photo.url) ? r.photo.url : (p && p.portrait ? p.portrait.url : null);
  const portrait = portraitUrl

  host.innerHTML=`<div class="scard ${pop?"pop":"dock"}">
    <div class="scard-banner" id="sc-banner" title="${p?"Click to set the project banner":"Create a project first"}">${banner}</div>

    <div class="scard-id">
      <div class="scard-portrait" id="sc-portrait" title="Click to set this student's photo">${portrait}</div>
      <div style="flex:1;min-width:0">
        <div class="scard-row">
          <div><label>First name</label><input id="sc-first" value="${esc(r.first)}"></div>
          <div><label>Last name</label><input id="sc-last" value="${esc(r.last)}"></div>
        </div>
        ${(r.photo||(p&&(p.banner||p.portrait)))?`<div style="margin-top:8px;display:flex;gap:10px">
          ${p&&p.banner?`<a href="#" id="sc-rmbanner" style="font-size:11px;color:var(--red)">remove banner</a>`:""}
          ${r.photo?`<a href="#" id="sc-rmphoto" style="font-size:11px;color:var(--red)">remove photo</a>`:""}
          ${p&&p.portrait?`<a href="#" id="sc-rmportrait" style="font-size:11px;color:var(--red)">remove old portrait</a>`:""}
        </div>`:""}
      </div>
    </div>

    <div class="scard-body">
      <label>Project name</label>
      ${p?`<input id="sc-title" value="${esc(p.title||"")}" placeholder="Untitled Project">
          <div style="margin-top:6px;display:flex;gap:10px;align-items:center">
            <a href="#/p/${p.id}" style="font-size:12px">open board →</a>
            <span class="muted" style="font-size:11px">${esc(p.type||"")}</span>
          </div>`
        :`<div class="sub" style="padding:8px 0">No project yet.
            <button class="btn small" id="sc-mkproj" style="margin-left:6px">Create one</button></div>`}

      <label>Sprint progress</label>
      <div id="sc-prog">${cardProgressHTML(p)}</div>

      <!-- The "not private yet" warning that used to live here is gone in
           v1.0.0: notes.json is behind require_role('manager') unconditionally,
           and an unconfigured install serves nothing at all, so there is no
           longer a state in which these are readable by non-managers. -->
      ${modeHas("notes") ? `
      <label>Notes <span class="muted" style="font-weight:400;text-transform:none">· private to management</span></label>

      : `
      <!-- No passphrase in this build, so there is nowhere private to put a
           note about a named student. The feature is absent rather than
           degraded — see HANDBOOK.md Part 1. -->

      <div class="sub" style="padding:6px 0">Private notes are only available in the server build,

    </div>

    <div class="scard-foot">
      <button class="btn small" id="sc-pop" title="${pop?"Dock to the side":"Pop out for more room"}">${pop?"⤡ dock":"⤢ pop out"}</button>
      <span class="scard-saved" id="sc-saved"></span>
      <span class="spacer"></span>
      <button class="btn small primary" id="sc-done">Done</button>

  /* ---- wiring (no full re-render from a text field: it would eat focus) ---- */
  const $=s=>host.querySelector(s);
  $("#sc-done").onclick=closeStudentCard;
  $("#sc-pop").onclick=toggleCardPop;
  $("#sc-banner").onclick=()=>setCardImage("banner");
  // Photo is a roster property now, so the card's portrait slot writes there.
  $("#sc-portrait").onclick=()=>setRosterPhoto(r.id);
  const rph=$("#sc-rmphoto"); if(rph) rph.onclick=e=>{e.preventDefault();clearRosterPhoto(r.id);};
  const rb=$("#sc-rmbanner"); if(rb) rb.onclick=e=>{e.preventDefault();clearCardImage("banner");};
  const rp=$("#sc-rmportrait"); if(rp) rp.onclick=e=>{e.preventDefault();clearCardImage("portrait");};

  $("#sc-first").onchange=e=>commitCardName("first",e.target.value);
  $("#sc-last").onchange=e=>commitCardName("last",e.target.value);

    // (another tab, a poll), adopt it instead of making a second one.
    if(cardProject(r)){ renderStudentCard(); return; }

      if(v) cardState.notes[r.id]=v; else delete cardState.notes[r.id];

}
async function removeStudent(id){
  const r=state.roster.find(x=>x.id===id); if(!r)return;
  const nm=fullName(r);
  const hasProj=state.projects.some(p=>p.student===nm);
  if(!confirm(`Remove ${nm} from the roster?`+(hasProj?"\n\nTheir project is kept — only the roster entry is removed.":"")))return;
  state.roster=state.roster.filter(x=>x.id!==id);
  await saveRoster(); render();
}
async function moveStudent(i,dir){
  const j=i+dir; if(j<0||j>=state.roster.length)return;
  const a=state.roster; [a[i],a[j]]=[a[j],a[i]];
  await saveRoster(); render();
}
function importRoster(){
  openForm("Paste-import Roster",[
    {name:"names",label:"One student per line — “First Last” or “Last, First”",type:"textarea"}
  ],async d=>{
    const lines=(d.names||"").split("\n").map(l=>l.trim()).filter(Boolean);
    if(!lines.length)return;
    const added=[];
    for(const line of lines){ const e=parseNameLine(line); if(e){ state.roster.push(e); added.push(e); } }
    if(!(await saveRoster())){ added.forEach(e=>{state.roster=state.roster.filter(r=>r!==e);}); return; }
    for(const e of added){ const p=newProjectShell(fullName(e), e.first? e.first+"’s Project":"Untitled Project","Environment"); await saveProject(p); }
    render();
  });
}
async function saveClassSettings(){
  state.settings=state.settings||{};
  state.settings.termName=document.getElementById("set-term").value.trim();
  state.settings.studioUrl=document.getElementById("set-site").value.trim();
  if(await saveSettings()) render();
}
/* Change any of the three passphrases. Always requires the CURRENT manager
   passphrase, even though you are already in a manager session — an unattended
   unlocked laptop should not be enough to lock the professor out of his class.
   Blanking the test passphrase disables that account; the server refuses to
   blank the other two. */
function setRolePass(role){
  const label={student:"Student (class)",manager:"Manager",test:"Test account"}[role]||role;
  openForm(`${label} passphrase`,[
    {type:"note",label:role==="student"
      ? "This is the one you hand to the class. Changing it does not sign anyone out — existing sessions keep working until they expire."
      : role==="test"
      ? "Sandbox account for feature testing. Its projects are flagged and hidden from the class board. Leave the new passphrase blank to disable the account."
      : "Your own passphrase. Guards the roster, class settings, backups, deletion and private notes."},
    {name:"current",label:"Current MANAGER passphrase",type:"password"},
    {name:"next",label:role==="test"?"New passphrase (blank to disable)":"New passphrase (min 6 characters)",type:"password"}
  ],async d=>{
    try{
      const res=await apiFetch("api.php?action=set_pass",{method:"POST",headers:jsonHeaders(),
        body:JSON.stringify({role,current:d.current||"",new:d.next||""})});
      const r=await res.json().catch(()=>({}));
      if(!res.ok){ alert(r.error||"Could not update passphrase."); return; }
      if(role==="manager") state.managerLocked=!!r.isSet;
      alert(`${label} passphrase updated.`);
      render();
    }catch(e){ alert("Could not update passphrase."); }
  });
}

/* ---------- class controls: schedule, save, wipe ---------- */
function parseLengths(str){ return (str||"").split(",").map(x=>parseFloat(x.trim())).filter(x=>x>0); }
async function saveSchedule(){
  const start=(document.getElementById("sch-start").value||"").trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(start)){ alert("Enter the term start as YYYY-MM-DD."); return; }
  const lengths=parseLengths(document.getElementById("sch-lengths").value);
  if(!lengths.length){ alert("Enter at least one sprint length, e.g. 2, 2, 1, 1, 2, 2"); return; }
  state.settings=state.settings||{};
  state.settings.sprintStart=start;
  state.settings.sprintLengths=lengths;
  if(await saveSettings()) render();
}
async function applyScheduleToAll(){
  const start=(document.getElementById("sch-start").value||"").trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(start)){ alert("Enter the term start as YYYY-MM-DD."); return; }
  const lengths=parseLengths(document.getElementById("sch-lengths").value);
  if(!lengths.length){ alert("Enter at least one sprint length."); return; }
  // persist the schedule too
  state.settings=state.settings||{}; state.settings.sprintStart=start; state.settings.sprintLengths=lengths; await saveSettings();
  const SD=sprintDatesFromLengths(start,lengths);
  if(!state.projects.length){ alert("Schedule saved. There are no projects to apply it to yet."); render(); return; }
  if(!confirm(`Apply this ${SD.length}-sprint calendar to all ${state.projects.length} project(s)?\n\nExisting stories and tasks are kept and re-dated. Any sprints beyond ${SD.length} are removed.`))return;
  for(const p of state.projects){
    const newSprints=SD.map((frame,i)=>{
      const days=daysOf(frame).length;
      const old=p.sprints[i];
      if(old){
        const oldDays=daysOf(old).length;
        old.num=i+1; old.start=frame.start; old.end=frame.end;
        if(days!==oldDays) allSprintTasks(old).forEach(t=>{   // structural: inactive stories too
          t.points=Array.from({length:days},(_,k)=>t.points[Math.min(k,oldDays-1)]??t.est);
        });
        return old;
      }
      return mkSprint(i+1,"Sprint "+(i+1),"",frame);
    });
    p.sprints=newSprints;
    await saveProject(p);
  }
  render();
  alert("Schedule applied to all projects.");
}
async function saveCurrentSnapshot(){
  try{
    const res=await apiFetch("api.php?action=create_backup",{method:"POST",headers:jsonHeaders()});
    const d=await res.json();
    if(d.success) alert("Saved a server snapshot:\n"+d.filename);
    else alert("Could not save snapshot: "+(d.error||"unknown error"));
  }catch(e){ alert("Network error while saving snapshot."); }
}
/* ---------- duplicate cleanup ----------
   Cleans up after the saveProject bug that created a fresh project on every
   click of "Create one". Deliberately conservative: only ever removes projects
   that are COMPLETELY empty, and only when that student still has another
   project left. Anything with a single task, link or banner is kept. */
function projectIsEmpty(p){
  if(!p) return false;
  const hasTasks=(p.sprints||[]).some(sp=>allSprintTasks(sp).length>0);
  const hasStories=(p.sprints||[]).some(sp=>(sp.stories||[]).length>0);
  const hasGoals=(p.sprints||[]).some(sp=>(sp.goal||"").trim()!=="");
  return !hasTasks && !hasStories && !hasGoals
      && !(p.backlog||[]).length && !(p.links||[]).length
      && !p.banner && !p.portrait;
}
function findDuplicateProjects(){
  const byStudent={};
  for(const p of state.projects||[]) (byStudent[p.student]=byStudent[p.student]||[]).push(p);
  const doomed=[];
  for(const nm of Object.keys(byStudent)){
    const group=byStudent[nm];
    if(group.length<2) continue;
    // Keep the richest one; if all are equally empty, keep the first.
    const score=p=>(p.sprints||[]).reduce((a,sp)=>a+allSprintTasks(sp).length,0)
                 + (p.backlog||[]).length + (p.links||[]).length + (p.banner?1:0);
    const keep=group.reduce((best,p)=>score(p)>score(best)?p:best,group[0]);
    for(const p of group) if(p!==keep && projectIsEmpty(p)) doomed.push(p);
  }
  return doomed;
}
/* Shown right on the home page, because that is where the mess is visible.
   Burying this in Manage → Class Controls meant nobody found it. */
function dupeBannerHTML(){
  // Tidying deletes projects, and delete_project is manager-only as of v1.0.0.
  // Showing a student a Tidy up button would just hand them a row of 403s.
  if(state.role!=="manager") return "";
  const n=findDuplicateProjects().length;
  if(!n) return "";
  const who=[...new Set(findDuplicateProjects().map(p=>p.student))];
  return `<div class="dupe-banner">
    <div><b>${n} duplicate project${n===1?"":"s"} on this board.</b>
      <div class="sub">${who.slice(0,4).join(", ")}${who.length>4?` and ${who.length-4} other${who.length-4===1?"":"s"}`:""}
        ${who.length===1?"has":"have"} more than one project. The extras are completely empty — no stories, tasks, backlog, links or banner — and each student keeps their fullest one.</div>
    </div>
    <button class="btn small primary" onclick="tidyDuplicateProjects()">Tidy up</button>
  </div>`;
}
async function tidyDuplicateProjects(){
  const doomed=findDuplicateProjects();
  if(!doomed.length){ alert("Nothing to tidy."); return; }
  const names=[...new Set(doomed.map(p=>p.student))].join(", ");
  if(!confirm(`Remove ${doomed.length} empty duplicate project(s)?\n\nAffected: ${names}\n\n`+
              `Only projects with no stories, tasks, backlog, links or banner are removed, `+
              `and every student keeps their fullest one.`)) return;
  let gone=0; const failed=[];
  for(const p of doomed){
    let ok=false;
    try{
      const res=await apiFetch(`api.php?action=delete_project&id=${encodeURIComponent(p.id)}`,{method:"POST"});
      ok = res.ok || res.status===404;    // already absent server-side is still a win
    }catch(e){ console.error("Could not delete duplicate:",p.id,e); }
    if(ok){ state.projects=state.projects.filter(x=>x.id!==p.id); gone++; }
    else failed.push(p.id);
  }
  render();
  // Report honestly: a silent "done" while the server kept the files would mean
  // the duplicates reappear on the next 10s poll, which looks like the tidy
  // did nothing at all.
  if(failed.length){
    alert(`Removed ${gone} of ${doomed.length}.\n\n${failed.length} could not be deleted on the server `+
          `and will come back on the next refresh. Check that api.php is writable, then try again.`);
  } else {
    alert(`Removed ${gone} empty duplicate project${gone===1?"":"s"}.`);
  }
}

async function cleanSlate(){
  if(!confirm("WIPE EVERYTHING?\n\nThis removes ALL students and ALL projects, sprints, and backlogs. A safety backup is saved first, and sample data will NOT reappear.\n\nContinue?"))return;
  if(!confirm("Last check — this cannot be undone except by restoring the safety backup. Wipe now?"))return;
  try{ await apiFetch("api.php?action=create_backup",{method:"POST",headers:jsonHeaders()}); }catch(e){}
  for(const p of [...state.projects]){
    try{ await apiFetch("api.php?action=delete_project&id="+encodeURIComponent(p.id),{method:"POST"}); }catch(e){}
  }
  state.projects=[];
  state.roster=[];
  if(!(await saveRoster())){ alert("Could not clear roster — check the manager passphrase."); await loadState(); render(); return; }
  state.settings=state.settings||{};
  state.settings.initialized=true; // block sample-data auto-seed
  await saveSettings();
  render();
  alert("Clean slate ready. Paste-import your real roster to begin the term.");
}

/* ---------- main render ---------- */
function render(){
  // Locked out: renderLock() owns the screen. Without this guard a stray
  // hashchange would repaint the board from whatever is left in memory.
  if(lockedOut){ renderLock(); return; }
  const who=document.getElementById("whoami");
  who.innerHTML=state.roster.map(r=>{const nm=fullName(r);return `<option ${nm===state.currentUser?"selected":""}>${esc(nm)}</option>`;}).join("");
  const h=location.hash.replace(/^#\/?/,"").split("/");
  if(h[0]==="manage")renderManage();
  else if(h[0]==="p"&&h[1]&&h[2]==="backlog")renderBacklogPage(h[1]);
  else if(h[0]==="p"&&h[1])renderProject(h[1],h[2]==="s"?h[3]:null);
  else renderHome();
  // The student card lives outside #app and survives this rebuild; refresh only
  // its derived readout so a rename or task edit shows up without eating focus.
  refreshStudentCard();
  syncManageChrome();
}

// Stamp the visible build version
document.getElementById("ver").textContent = "v"+APP_VERSION;
document.title = "GAME 405 · Sprint Dashboard v"+APP_VERSION;

/* Name the running build in the top bar. Called once detectBackendMode() has
   decided, so it is always the truth rather than the default. */
function stampModeChip(){
  const el = document.getElementById("modechip");
  if(!el) return;
  const copy = {
    server: ["server", "Live on the SCAD server. Shared with the class, behind the class passphrase."],
    cloud:  ["cloud",  "Shared through Firebase. Everyone in the class sees the same data — and so can anyone with the link."],
    local:  ["local",  "This computer only. Nothing is shared and nothing leaves this browser. Export to JSON to keep a copy."]
  }[BACKEND_MODE];
  el.textContent = copy[0];
  el.title = copy[1];
  el.className = "ver modechip m-" + BACKEND_MODE;
  document.title = "GAME 405 · Sprint Dashboard v" + APP_VERSION +
                   (BACKEND_MODE === "server" ? "" : " (" + copy[0] + ")");
}

/* ---------- boot ----------
   Work out which of the three builds this is, THEN ask who we are. In server
   mode nothing renders and no class data is requested until the session is
   confirmed, so an unauthenticated visitor gets the lock screen and an app that
   never held any data to leak. Local and cloud have no session and skip it. */
(async function boot(){
  try{
    await detectBackendMode();
    stampModeChip();

    const res = await apiFetch("api.php?action=status");
    const s = await res.json();
    state.configured = !!s.configured;
    state.role = s.role || "none";
    state.trueRole = s.trueRole || state.role;
    if (!s.configured || !s.authenticated) { handleSignedOut(!s.configured); return; }
    if (await loadState()) { render(); startPolling(); return; }

    // Only reachable in cloud mode: local storage cannot fail to answer and
    // server mode has already gone to the lock screen. Almost always the
    // database rules, a wrong URL, or no internet.
    bootFailure("Could not reach the class database.");
  }catch(e){
    // Reaching here now means something broke in the app itself: local mode is
    // the fallback and it cannot fail to answer, so this is no longer the
    // "server is down" path it used to be.
    console.error("Boot failed:", e);
    if (!lastBackendError) lastBackendError = e.message || String(e);
    bootFailure("The app failed to start.");
  }
})();

/* The failure screen is the only thing on it, so it has to carry the diagnosis.
   Printing the backend's own words here has saved more time than any amount of
   "check the console" ever did. */
function bootFailure(headline) {
  const detail = lastBackendError
    ? `<div style="margin-top:14px;font-size:12px;opacity:.75;text-align:left;
         display:inline-block;max-width:640px">
         <b>What the database said:</b><br>
         <code style="white-space:pre-wrap;word-break:break-word">${esc(lastBackendError)}</code>
       </div>`
    : "";
  const hint = BACKEND_MODE === "cloud"
    ? `<div style="margin-top:14px;font-size:12px;opacity:.75">
         If this mentions <b>permission denied</b>, the database rules are still
         locked \u2014 see Part 3, step 3 of HANDBOOK.md.
       </div>`
    : "";
  document.getElementById("app").innerHTML =
    `<div class="empty">${esc(headline)} Reload the page to try again.${detail}${hint}</div>`;
}

window.addEventListener("resize",()=>{ if(location.hash.includes("/p/")) render(); });
</script>
